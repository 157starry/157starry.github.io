<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siapa Kamu di Dunia Paralel?</title>
<meta name="description" content="10 pertanyaan acak, 20 versi dirimu di dunia paralel. Kamu yang mana?">
<meta property="og:type" content="website">
<meta property="og:title" content="Siapa Kamu di Dunia Paralel?">
<meta property="og:description" content="10 pertanyaan acak, 20 versi dirimu di dunia paralel. Kamu yang mana?">
<meta property="og:url" content="https://157starry.github.io/dunia-paralel/">
<meta name="theme-color" content="#080b1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Space+Grotesk:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b1a; --ink:#eef0ff; --dim:#b4b8e6; --cyan:#47e0ff; --pink:#ff4fd8; --gold:#ffe45c; --violet:#8b6bff;
  --glass:rgba(255,255,255,.05); --line:rgba(255,255,255,.16);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(700px 480px at 85% 15%,rgba(139,107,255,.28),transparent 70%),
   radial-gradient(600px 420px at 5% 95%,rgba(71,224,255,.16),transparent 70%),
   radial-gradient(500px 360px at 50% 120%,rgba(255,79,216,.14),transparent 70%)}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.8;
  background-image:
   radial-gradient(1.5px 1.5px at 8% 14%,#fff,transparent),radial-gradient(1px 1px at 22% 72%,#fffb,transparent),
   radial-gradient(1.5px 1.5px at 41% 9%,#fffc,transparent),radial-gradient(1px 1px at 57% 88%,#fff9,transparent),
   radial-gradient(1.5px 1.5px at 71% 22%,#fff,transparent),radial-gradient(1px 1px at 93% 61%,#fffb,transparent),
   radial-gradient(1px 1px at 33% 42%,#fff8,transparent),radial-gradient(1px 1px at 81% 81%,#fffa,transparent),
   radial-gradient(1.5px 1.5px at 64% 50%,#fff9,transparent),radial-gradient(1px 1px at 14% 50%,#fff9,transparent);
  animation:drift 60s linear infinite alternate}
@keyframes drift{to{transform:translateY(-30px)}}
.grid-floor{position:fixed;left:-50%;right:-50%;bottom:-10%;height:45%;z-index:0;pointer-events:none;opacity:.22;
  background-image:linear-gradient(rgba(71,224,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(71,224,255,.6) 1px,transparent 1px);
  background-size:60px 60px;transform:perspective(500px) rotateX(70deg);
  mask-image:linear-gradient(to top,#000,transparent 85%);-webkit-mask-image:linear-gradient(to top,#000,transparent 85%)}

.app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:20px 24px 48px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0 18px}
.brand{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:3px;color:var(--cyan);display:flex;align-items:center;gap:10px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.lang{display:flex;padding:4px;border-radius:99px;border:1px solid var(--line);background:rgba(10,12,32,.7);backdrop-filter:blur(8px)}
.lang button{font:700 13px 'Space Grotesk',sans-serif;letter-spacing:1px;color:var(--dim);background:none;border:none;padding:10px 16px;border-radius:99px;cursor:pointer;min-width:52px;transition:all .25s}
.lang button[aria-pressed="true"]{color:#0a0d1f;background:linear-gradient(90deg,var(--cyan),#a8f3ff);box-shadow:0 0 18px rgba(71,224,255,.5)}

main{flex:1;display:flex;align-items:center;justify-content:center}
.screen{width:100%;display:none;animation:in .5s ease both}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* portal core (abstract, no mascot) */
.core{--s:220px;position:relative;width:var(--s);height:var(--s);flex:none}
.core span{position:absolute;border-radius:50%}
.core .r1{inset:0;border:1.5px dashed rgba(71,224,255,.55);animation:rot 18s linear infinite}
.core .r2{inset:12%;border:2px solid transparent;border-top-color:var(--pink);border-bottom-color:var(--cyan);animation:rot 6s linear infinite reverse;filter:drop-shadow(0 0 8px rgba(255,79,216,.6))}
.core .r3{inset:26%;border:1px solid rgba(255,228,92,.6);animation:rot 10s linear infinite}
.core .r3::before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.core .orb{inset:36%;background:radial-gradient(circle at 35% 30%,#ffffff,#8ff7ff 25%,#5a3dd8 65%,#1a1446);box-shadow:0 0 40px rgba(71,224,255,.7),0 0 90px rgba(139,107,255,.5);animation:breathe 3s ease-in-out infinite}
.core.busy .orb{animation:breathe .6s ease-in-out infinite}
.core.busy .r2{animation-duration:1.4s}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(.88);filter:brightness(1.3)}}
.core.blip .orb{animation:blip .5s ease}
@keyframes blip{40%{transform:scale(1.15);filter:brightness(1.8)}}

/* glass */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bubble{position:relative;padding:20px 22px;min-height:96px}
.bubble .who{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:3px;color:var(--cyan);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.bubble .who span:last-child{color:var(--dim);letter-spacing:1px}
.bubble p{margin:0;font-size:21px;line-height:1.45;min-height:1.45em}
.caret{display:inline-block;width:9px;height:1.1em;vertical-align:-3px;margin-left:2px;background:var(--cyan);animation:pulse .8s steps(2) infinite}

.btn{font:700 16px 'Space Grotesk',sans-serif;color:#0a0d1f;border:none;border-radius:14px;padding:16px 26px;cursor:pointer;min-height:52px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 10px 30px rgba(255,79,216,.25);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(71,224,255,.35)}
.btn.ghost{color:var(--ink);background:var(--glass);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn:disabled{opacity:.6;cursor:wait}
.btn:focus-visible,.opt:focus-visible,.lang button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* start */
.start{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:center}
.start .stage{display:flex;flex-direction:column;align-items:center;gap:26px}
.tag{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:4px;color:var(--pink)}
h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(34px,5.2vw,58px);line-height:1.05;margin:12px 0 16px;
  background:linear-gradient(100deg,#fff 10%,var(--cyan) 45%,var(--pink) 75%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:sheen 6s ease-in-out infinite alternate}
@keyframes sheen{to{background-position:100% 0}}
.lead{font-size:18px;line-height:1.55;color:var(--dim);margin:0 0 26px;max-width:46ch}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;max-width:440px}
.field label{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:2px;color:var(--cyan)}
.field input{font:500 18px 'Space Grotesk',sans-serif;color:var(--ink);background:rgba(8,11,26,.6);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-height:54px;transition:border-color .2s,box-shadow .2s}
.field input::placeholder{color:#8a8fbf}
.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(71,224,255,.15)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.meta{font-size:14px;color:var(--dim)}
.coll-mini{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:1px;color:var(--gold);margin-top:18px}

/* quiz */
.hud{display:flex;align-items:center;gap:14px;margin-bottom:22px;font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:2px;color:var(--cyan)}
.bar{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan));box-shadow:0 0 12px var(--cyan);transition:width .5s ease}
.qtop{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;align-items:center;margin-bottom:22px}
.qtop .core{--s:120px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{position:relative;display:flex;gap:14px;align-items:center;text-align:left;font:500 17px/1.35 'Space Grotesk',sans-serif;color:var(--ink);
  padding:18px 20px;min-height:72px;border-radius:16px;border:1px solid var(--line);background:var(--glass);cursor:pointer;overflow:hidden;
  transition:transform .2s,border-color .2s,background .2s;opacity:0;transform:translateY(10px)}
.opts.show .opt{opacity:1;transform:none;transition:opacity .35s ease,transform .35s ease,border-color .2s,background .2s}
.opts.show .opt:nth-child(2){transition-delay:.06s}.opts.show .opt:nth-child(3){transition-delay:.12s}.opts.show .opt:nth-child(4){transition-delay:.18s}
.opt:hover{border-color:rgba(71,224,255,.7);background:rgba(71,224,255,.08)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 14px 'Share Tech Mono',monospace;color:var(--cyan);border:1px solid rgba(71,224,255,.5)}
.opt.pick{border-color:var(--cyan);background:linear-gradient(90deg,rgba(255,79,216,.22),rgba(71,224,255,.22))}
.opt.pick .k{background:var(--cyan);color:#0a0d1f}
.opt.pick::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:swipe .6s ease}
@keyframes swipe{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.opts.lock .opt{pointer-events:none}
.opts.lock .opt:not(.pick){opacity:.35}

/* scan */
.scan{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.scanline{font-family:'Share Tech Mono',monospace;font-size:17px;letter-spacing:1px;color:var(--cyan);min-height:24px}
.scan .bar{width:min(380px,80vw);flex:none}

/* result */
.result{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:48px;align-items:start}
.card-zone{display:flex;flex-direction:column;align-items:center;gap:12px;perspective:1000px}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;
  position:relative;width:340px;max-width:86vw;aspect-ratio:340/510;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:11px;
  background:linear-gradient(160deg,#1e2050,#10122c 55%,#26124c);
  transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .15s ease-out;
  box-shadow:0 30px 90px rgba(80,40,200,.5),0 0 0 1px rgba(255,255,255,.06)}
.card.reveal{animation:reveal 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes reveal{0%{transform:rotateY(180deg) scale(.6);opacity:0;filter:brightness(3)}60%{opacity:1;filter:brightness(1.6)}100%{transform:rotateY(0) scale(1);filter:none}}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;
  background:linear-gradient(115deg,transparent 18%,rgba(255,60,200,.42) 32%,rgba(60,220,255,.42) 46%,rgba(255,235,90,.36) 60%,transparent 76%);
  background-size:260% 260%;background-position:var(--mx) var(--my);opacity:.85}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--ang,0deg),#ff4fd8,#47e0ff,#ffe45c,#8b6bff,#ff4fd8);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.28),transparent 45%)}
.c-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);position:relative}
.rarity{font:800 11px 'Unbounded',sans-serif;letter-spacing:2px;padding:6px 11px;border-radius:99px;color:#2a1300;background:linear-gradient(90deg,var(--gold),#ff9d4f)}
.c-art{position:relative;flex:none;height:28%;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.c-art svg{width:40%;height:auto;filter:drop-shadow(0 0 10px currentColor)}
.c-role{position:absolute;left:10px;bottom:10px;font:700 11px 'Share Tech Mono',monospace;letter-spacing:2px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff}
.c-code{position:absolute;right:10px;bottom:10px;font:700 11px 'Share Tech Mono',monospace;letter-spacing:2px;color:rgba(255,255,255,.8)}
.c-holder{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--dim);position:relative}
.c-name{font:800 22px/1.1 'Unbounded',sans-serif;margin-top:2px;word-break:break-word}
.c-title{font:700 15px/1.3 'Space Grotesk',sans-serif;margin-top:4px}
.c-sub{font-size:12px;color:var(--dim);margin-top:2px}
.stats{display:grid;grid-template-columns:auto minmax(0,1fr) 24px;gap:6px 10px;align-items:center;font-size:12px;position:relative}
.stats .tr{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.stats .tr div{height:100%;border-radius:6px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1) .6s}
.c-weak{margin-top:auto;font-size:12px;line-height:1.4;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.32);position:relative}
.hint{font-size:13px;color:var(--dim)}

.info .intro{font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:2px;color:var(--pink)}
.info h2{font:800 clamp(28px,4vw,42px)/1.1 'Unbounded',sans-serif;margin:10px 0 14px}
.new-badge{display:inline-block;margin-left:8px;font:800 11px 'Unbounded',sans-serif;letter-spacing:2px;padding:5px 10px;border-radius:99px;background:var(--gold);color:#2a1300;vertical-align:middle}
.info .desc{font-size:18px;line-height:1.6;color:#d9dcff;margin:0 0 22px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.fact{padding:14px 16px}
.fact b{display:block;font-family:'Share Tech Mono',monospace;font-weight:400;font-size:12px;letter-spacing:2px;color:var(--cyan);margin-bottom:6px}
.fact span{font-size:15px;line-height:1.4}
.trans{padding:14px 16px;margin-bottom:18px}
.trans b{display:block;font-family:'Share Tech Mono',monospace;font-weight:400;font-size:12px;letter-spacing:2px;color:var(--pink);margin-bottom:6px}
.trans p{margin:0;font-size:16px;line-height:1.45;font-style:italic;color:#e3e5ff}

.coll{padding:16px;margin-bottom:20px}
.coll-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--gold)}
.coll-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.slot{aspect-ratio:3/4;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);display:grid;place-items:center;font:700 9px 'Share Tech Mono',monospace;color:#6f74a8}
.slot.got{border-color:transparent;color:#0a0d1f}
.slot.now{outline:2px solid #fff;outline-offset:2px}

.share-label{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--cyan);margin:4px 0 10px}
.share{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.share .btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.share .btn svg{width:20px;height:20px;flex:none}
.btn.ig{color:#fff;background:linear-gradient(100deg,#7a3cff,#e63fb0 55%,#ff9d4f);box-shadow:0 10px 30px rgba(230,63,176,.3)}
.btn.wa{color:#04210f;background:linear-gradient(100deg,#3ee07f,#a6f5c4);box-shadow:0 10px 30px rgba(62,224,127,.25)}
.steps{margin:0;padding-left:22px;text-align:left;font-size:15px;line-height:1.55;color:#e3e5ff;width:100%}
.steps li{margin-bottom:6px}
.modal-title{font:800 20px 'Unbounded',sans-serif;margin:4px 0 0}
.modal .row{justify-content:center}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,5,14,.8);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.modal .box{max-width:420px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.modal img{width:100%;border-radius:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;z-index:30;padding:12px 20px;border-radius:12px;background:#10142e;border:1px solid var(--cyan);font-weight:700;transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .start,.result{grid-template-columns:minmax(0,1fr);gap:28px}
  .start .stage{order:-1}
  .start .core{--s:160px}
  .qtop{grid-template-columns:72px minmax(0,1fr);gap:14px}
  .qtop .core{--s:72px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .bubble p{font-size:18px}
  .facts{grid-template-columns:minmax(0,1fr)}
  .coll-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="sky"></div><div class="stars"></div><div class="grid-floor"></div>

<div class="app">
  <header>
    <div class="brand"><i></i><span>PARALLEL//PORTAL v3.0</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="id" aria-pressed="true">ID</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main>
    <section class="screen on" id="s-start">
      <div class="start">
        <div>
          <div class="tag" data-t="tag"></div>
          <h1 data-t="title"></h1>
          <p class="lead" data-t="lead"></p>
          <form id="startForm" autocomplete="off">
            <div class="field">
              <label for="nameIn" data-t="nameLabel"></label>
              <input id="nameIn" maxlength="20" data-tp="namePh">
            </div>
            <div class="row">
              <button class="btn" type="submit" data-t="start"></button>
              <span class="meta" data-t="meta"></span>
            </div>
            <div class="coll-mini" id="collMini"></div>
          </form>
        </div>
        <div class="stage">
          <div class="core" id="coreStart"><span class="r1"></span><span class="r2"></span><span class="r3"></span><span class="orb"></span></div>
          <div class="glass bubble" style="max-width:400px;width:100%">
            <div class="who"><span data-t="sys"></span><span>//ONLINE</span></div>
            <p id="greet"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="s-quiz">
      <div class="hud"><span id="qnum">Q 01/10</span><div class="bar"><div id="qbar"></div></div></div>
      <div class="qtop">
        <div class="core" id="coreQuiz"><span class="r1"></span><span class="r2"></span><span class="r3"></span><span class="orb"></span></div>
        <div class="glass bubble" id="qbubble">
          <div class="who"><span data-t="sys"></span><span data-t="skip"></span></div>
          <p id="qtext"></p>
        </div>
      </div>
      <div class="opts" id="opts"></div>
    </section>

    <section class="screen" id="s-scan">
      <div class="scan">
        <div class="core busy" style="--s:240px"><span class="r1"></span><span class="r2"></span><span class="r3"></span><span class="orb"></span></div>
        <div class="scanline" id="scanText"></div>
        <div class="bar"><div id="scanBar"></div></div>
      </div>
    </section>

    <section class="screen" id="s-result">
      <div class="result">
        <div class="card-zone">
          <div class="card" id="card">
            <div class="glare"></div>
            <div class="c-top"><span class="rarity" id="cRarity">LEGENDARY</span><span id="cNo">No. 0000</span></div>
            <div class="c-art" id="cArt"></div>
            <div style="position:relative">
              <div class="c-holder" data-t="holder"></div>

/* ---------- typewriter ---------- */
let typeTimer=null,typeFull="",typeEl=null,typeDone=null;
function typeText(el,text,done){
  clearInterval(typeTimer);typeEl=el;typeFull=text;typeDone=done;let i=0;
  el.textContent="";const node=document.createTextNode("");const caret=document.createElement("span");caret.className="caret";
  el.append(node,caret);
  typeTimer=setInterval(()=>{i++;node.textContent=text.slice(0,i);if(i>=text.length)finishType();},20);
}
function finishType(){
  clearInterval(typeTimer);typeTimer=null;
  if(typeEl)typeEl.textContent=typeFull;
  const cb=typeDone;typeDone=null;if(cb)cb();
}

function renderQuestion(instant){
  const q=Q[deck[qi]];
  if(!optOrder.length)optOrder=shuffle([0,1,2,3]);

  const box=$("#opts");const pickEl=box.querySelector(".pick");const picked=pickEl?Number(pickEl.dataset.o):-1;
  box.className="opts"+(locked?" lock show":"");box.innerHTML="";
  optOrder.forEach((oi,pos)=>{
    const o=q.o[oi];
    const b=document.createElement("button");b.type="button";b.className="opt"+(locked&&oi===picked?" pick":"");b.dataset.o=oi;
    const k=document.createElement("span");k.className="k";k.textContent="ABCD"[pos];

function answer(oi,btn){
  if(locked)return;locked=true;
  if(typeTimer)finishType();
  btn.classList.add("pick");$("#opts").classList.add("lock","show");
  const tag=Q[deck[qi]].o[oi][0];se[tag[0]]++;sr[tag[1]]++;
  $("#qbar").style.width=((qi+1)/QPER*100)+"%";
  blip("coreQuiz");
  const re=t("react");
  setTimeout(()=>{$("#qtext").textContent=re[Math.floor(Math.random()*re.length)];},220);
  setTimeout(()=>{
    locked=false;qi++;optOrder=[];
    if(qi<QPER)renderQuestion(false);else startScan();
  },1150);
}

function startScan(){

  let step=0;$("#scanText").textContent=t("scan")[0];
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition="width 2.6s cubic-bezier(.4,0,.2,1)";bar.style.width="100%";}));
  const iv=setInterval(()=>{step++;if(step<3)$("#scanText").textContent=t("scan")[step];},900);
  setTimeout(()=>{clearInterval(iv);computeResult();show("result");renderResult(true);},2800);
}

/* ---------- result ---------- */
function computeResult(){
  const h=hash(nm().toLowerCase());
  const pickTop=(obj,order,salt)=>{const m=Math.max(...order.split("").map(k=>obj[k]));const top=order.split("").filter(k=>obj[k]===m);return top[(h>>>salt)%top.length];};
  const e=pickTop(se,EORDER,0),r=pickTop(sr,RORDER,7);
  const key=e+r,E=ELEM[e],R=ROLE[r];
  const jit=n=>((h>>>(n*5))%13)-6;
  const cl=v=>Math.max(8,Math.min(99,v));
  const stats=[cl(E.base[0]+R.adj[0]+jit(1)),cl(E.base[1]+R.adj[1]+jit(2)),cl(E.base[2]+R.adj[2]+jit(3)),cl(25+((h>>>11)%75))];
  const rv=(h>>>3)%100;
  const rarity=rv<8?"MYTHIC":rv<28?"LEGENDARY":rv<60?"EPIC":"RARE";
  const isNew=!found.includes(key);
  if(isNew){found.push(key);try{localStorage.setItem("dp-found",JSON.stringify(found));}catch(err){}}
  result={key,e,r,stats,rarity,isNew,no:String(h%10000).padStart(4,"0")};
}

  $("#waBtn").href="https://wa.me/?text="+encodeURIComponent(wa);
  if(animate){card.classList.remove("reveal");void card.offsetWidth;card.classList.add("reveal");}
}
function renderCollection(){

/* tilt */
(function(){
  const card=$("#card");
  function move(x,y){
    const r=card.getBoundingClientRect();
    const px=Math.min(1,Math.max(0,(x-r.left)/r.width)),py=Math.min(1,Math.max(0,(y-r.top)/r.height));
    card.style.setProperty("--ry",((px-.5)*24)+"deg");card.style.setProperty("--rx",((.5-py)*20)+"deg");
    card.style.setProperty("--mx",(px*100)+"%");card.style.setProperty("--my",(py*100)+"%");
  }
  card.addEventListener("pointermove",e=>{card.classList.remove("reveal");move(e.clientX,e.clientY);});
  card.addEventListener("pointerleave",()=>{card.style.setProperty("--rx","0deg");card.style.setProperty("--ry","0deg");card.style.setProperty("--mx","50%");card.style.setProperty("--my","50%");});
  card.addEventListener("touchmove",e=>{const tt=e.touches[0];if(tt)move(tt.clientX,tt.clientY);},{passive:true});
})();

function loadSVG(svg,color){
  return new Promise(res=>{
    const s=svg.replace(/currentColor/g,color).replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" ');
    const img=new Image();img.onload=()=>res(img);img.onerror=()=>res(null);
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
  });
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrap(ctx,text,x,y,maxW,lh,maxLines){
  const words=text.split(" ");let line="",lines=[];
  for(const w of words){const test=line?line+" "+w:w;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}else line=test;}
  if(line)lines.push(line);lines=lines.slice(0,maxLines||9);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return lines.length*lh;
}

  const hs=hash(nm());for(let i=0;i<90;i++){const sx=(Math.imul(hs+i*97,2654435761)>>>0)%W,sy=(Math.imul(hs+i*31,40503)>>>0)%H;x.fillStyle="rgba(255,255,255,"+(.3+(i%5)/8)+")";const z=i%7===0?3:2;x.fillRect(sx,sy,z,z);}
  if(story){
    g=x.createRadialGradient(W/2,H*.45,50,W/2,H*.45,900);g.addColorStop(0,"rgba(139,107,255,.35)");g.addColorStop(1,"rgba(139,107,255,0)");x.fillStyle=g;x.fillRect(0,0,W,H);
    x.textAlign="center";x.font="400 30px 'Share Tech Mono', monospace";x.fillStyle="#47e0ff";x.fillText(t("storyTop"),W/2,170);
    x.font="800 52px Unbounded, sans-serif";g=x.createLinearGradient(140,0,W-140,0);g.addColorStop(0,"#ffffff");g.addColorStop(.5,"#47e0ff");g.addColorStop(1,"#ff4fd8");x.fillStyle=g;
    wrap(x,t("footer"),W/2,248,W-160,62,2);x.textAlign="left";
  }
  const cx=150,cy=story?360:100,cw=780,ch=1080;
  x.save();x.shadowColor="rgba(120,70,255,.6)";x.shadowBlur=80;rr(x,cx,cy,cw,ch,46);

let downloads=null;
(async()=>{try{if(window.claude&&window.claude.use)downloads=await window.claude.use("downloads");}catch(e){downloads=null;}})();

function slug(){return nm().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"kartu";}
// returns "saved" | "declined" | "preview"
const IN_CLAUDE=!!(window.claude&&window.claude.use);
async function offerImage(cv,fname,useShare){
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  if(!blob)return "preview";
  if(IN_CLAUDE){
    if(downloads){
      try{await downloads.save({filename:fname,data:blob});return "saved";}
      catch(err){if(err&&err.code==="declined")return "declined";}
    }
    return "preview";
  }
  // Standalone (your own hosting): native share sheet on phones, normal download elsewhere
  if(useShare&&navigator.canShare){
    try{
      const file=new File([blob],fname,{type:"image/png"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:t("footer")});
        return "saved";
      }
    }catch(err){if(err&&err.name==="AbortError")return "declined";}
  }
  try{
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return "saved";
  }catch(e){return "preview";}
}
function openModal(o){
  $("#modalTitle").textContent=o.title||"";
  const img=$("#modalImg");
  if(o.cv){img.src=o.cv.toDataURL("image/png");img.alt=CARD[result.key][lang].t;img.hidden=false;img.style.maxHeight=o.story?"52vh":"60vh";img.style.width="auto";img.style.maxWidth="100%";}
  else img.hidden=true;
  $("#modalTxt").textContent=o.text||"";
  const ol=$("#modalSteps");ol.innerHTML="";
  if(o.steps){o.steps.forEach(s=>{const li=document.createElement("li");li.textContent=s;ol.appendChild(li);});ol.hidden=false;}else ol.hidden=true;
  $("#modalLink").hidden=!o.link;
  $("#modal").classList.add("on");(o.link?$("#modalLink"):$("#modalClose")).focus();
}
$("#saveBtn").addEventListener("click",async()=>{
  const btn=$("#saveBtn");btn.disabled=true;
  try{
    const cv=await drawCard(false);
    const r=await offerImage(cv,"dunia-paralel-"+slug()+".png");
    if(r==="saved")toast(t("saved"));else if(r==="declined")toast(t("declined"));
    else openModal({title:t("imgTitle"),cv,text:t("longpress")});
  }finally{btn.disabled=false;}
});
$("#igBtn").addEventListener("click",async()=>{
  const btn=$("#igBtn");btn.disabled=true;
  try{
    const cv=await drawCard(true);
    const r=await offerImage(cv,"story-dunia-paralel-"+slug()+".png",true);
    if(r==="declined"){toast(t("declined"));return;}
    if(r==="saved")openModal({title:t("igTitle"),text:t("igSaved"),steps:t("igSteps"),link:true});
    else openModal({title:t("igTitle"),cv,story:true,text:t("igPreview"),steps:t("igSteps"),link:true});
  }finally{btn.disabled=false;}
});
$("#modalLink").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(SHARE_URL);toast(t("linkCopied"));}catch(e){toast(t("noCopy"));}
});
$("#modalClose").addEventListener("click",()=>$("#modal").classList.remove("on"));
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")$("#modal").classList.remove("on");});

applyLang();
