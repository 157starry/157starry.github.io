<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starry · I Know Your Song of the Day</title>
<meta name="description" content="Jawab 7 pertanyaan, biar Starry membaca rasi bintangmu dan menebak lagumu hari ini. Answer 7 questions and let Starry guess your song of the day.">
<meta name="theme-color" content="#060518">
<meta property="og:type" content="website">
<meta property="og:title" content="Starry · I Know Your Song of the Day">
<meta property="og:description" content="Jawab 7 pertanyaan, biar Starry menebak lagumu hari ini ✦">
<meta property="og:image" content="https://157starry.github.io/song/og-image.png">
<meta property="og:url" content="https://157starry.github.io/song/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23060518'/%3E%3Cpath d='M32 10l5 15 15 5-15 5-5 15-5-15-15-5 15-5z' fill='%23c9a8ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060518;
  --ink:#eef0ff;
  --muted:#a9abd6;
  --peri:#9fb8ff;
  --lav:#c9a8ff;
  --pink:#ffb3dc;
  --mint:#a8f0e0;
  --accent:#9fb8ff;
  --accent2:#c9a8ff;
  --glass:rgba(22,20,58,.42);
  --line:rgba(255,255,255,.14);
  --radius:26px;
  --f-cute:'Fredoka',system-ui,sans-serif;
  --f-body:'Quicksand',system-ui,sans-serif;
  --f-hud:'Orbitron',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
button,input{font:inherit;color:inherit}
#bg,#trail{position:fixed;inset:0;width:100%;height:100%;display:block}
#trail{pointer-events:none;z-index:3}
#flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.9),rgba(201,168,255,.35) 35%,transparent 70%)}
#flash.on{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.brand{font-family:var(--f-hud);font-size:12px;letter-spacing:.28em;color:var(--muted);display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-cute);font-weight:600;letter-spacing:.02em;font-size:18px;color:var(--ink);
  background:linear-gradient(90deg,var(--peri),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.lang{position:relative;display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lang button{position:relative;z-index:1;background:none;border:0;cursor:pointer;font-family:var(--f-hud);font-size:11px;letter-spacing:.15em;padding:7px 14px;border-radius:999px;color:var(--muted);transition:color .3s}
.lang button.on{color:#14122e}
.lang .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);left:4px;border-radius:999px;
  background:linear-gradient(90deg,var(--peri),var(--lav));box-shadow:0 0 18px rgba(159,184,255,.55);transition:transform .45s cubic-bezier(.6,.05,.2,1.3)}
.lang[data-l="en"] .pill{transform:translateX(100%)}

/* ---------- stage & card ---------- */
main{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;padding:0 12px 4vh;pointer-events:none}
#card{pointer-events:auto;position:relative;width:min(560px,100%);border-radius:var(--radius);padding:28px 28px 26px;
  background:linear-gradient(160deg,rgba(40,36,96,.55),rgba(14,12,40,.55));
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 60px -10px color-mix(in srgb,var(--accent) 35%,transparent);
  transition:box-shadow 1s}
#card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,white),rgba(255,255,255,.05) 40%,rgba(255,255,255,.04) 60%,var(--accent2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.screen{animation:in .55s cubic-bezier(.2,.7,.2,1)}
.screen.out{animation:out .3s ease-in forwards}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes out{to{opacity:0;transform:translateY(-10px) scale(.98);filter:blur(4px)}}

.kicker{font-family:var(--f-hud);font-size:10.5px;letter-spacing:.32em;color:var(--accent);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:var(--f-cute);font-weight:600;font-size:clamp(28px,5.4vw,40px);line-height:1.08;margin:12px 0 10px;
  background:linear-gradient(100deg,#fff 10%,var(--peri) 45%,var(--pink) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);line-height:1.6;font-size:15px}
.field{margin-top:22px}
.field label{display:block;font-family:var(--f-hud);font-size:10px;letter-spacing:.28em;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.field input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:15px 18px;font-size:17px;font-weight:600;outline:none;transition:border-color .3s,box-shadow .3s}
.field input::placeholder{color:rgba(169,171,214,.55);font-weight:500}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent),0 0 30px -6px var(--accent)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.btn{cursor:pointer;border:0;border-radius:16px;padding:15px 22px;font-family:var(--f-cute);font-weight:500;font-size:17px;letter-spacing:.01em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .2s,box-shadow .3s,background .3s}
.btn.primary{width:100%;margin-top:14px;color:#15122f;background:linear-gradient(95deg,var(--peri),var(--lav) 55%,var(--pink));
  box-shadow:0 10px 30px -8px color-mix(in srgb,var(--lav) 70%,transparent)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px -8px color-mix(in srgb,var(--lav) 90%,transparent)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}

/* quiz */
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .4s}
.dots i.done{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.dots i.now{background:#fff;box-shadow:0 0 12px #fff;transform:scale(1.35)}
.q{font-family:var(--f-cute);font-weight:500;font-size:clamp(21px,4vw,26px);line-height:1.25;margin:16px 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{cursor:pointer;text-align:left;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:18px;padding:14px 14px 15px;
  display:flex;flex-direction:column;gap:8px;min-height:92px;font-weight:600;font-size:14.5px;line-height:1.35;position:relative;overflow:hidden;
  transition:transform .25s,border-color .25s,background .25s,box-shadow .25s}
.opt .em{font-size:22px;line-height:1}
.opt::after{content:"";position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 45%,transparent),transparent 70%);opacity:0;transition:opacity .3s}
.opt:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 70%,transparent);background:rgba(255,255,255,.08);box-shadow:0 12px 30px -12px var(--accent)}
.opt:hover::after{opacity:1}
.opt.picked{border-color:#fff;background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent),0 0 40px -6px var(--accent)}
.opts.locked .opt:not(.picked){opacity:.35}

/* reading */
.reading{text-align:center;padding:18px 0 8px}
.reading h2{font-family:var(--f-cute);font-weight:500;font-size:24px;margin:14px 0 18px}
.scan{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.scan i{position:absolute;inset:0;width:40%;border-radius:4px;background:linear-gradient(90deg,transparent,var(--accent),var(--pink),transparent);animation:scan 1.1s ease-in-out infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.reading .hud{font-family:var(--f-hud);font-size:10px;letter-spacing:.3em;color:var(--muted);margin-top:14px}

/* result */
.for{font-family:var(--f-hud);font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:14px}
.for b{font-family:var(--f-cute);font-weight:600;letter-spacing:.02em;font-size:15px;color:var(--ink);text-transform:none;margin-left:4px}
.song{font-family:var(--f-cute);font-weight:600;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:10px 0 4px;
  background:linear-gradient(100deg,#fff,var(--accent) 50%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.artist{font-size:17px;font-weight:600;color:var(--ink);opacity:.85}
.reason{margin-top:14px;color:var(--muted);line-height:1.6;font-size:14.5px;border-left:2px solid var(--accent);padding-left:12px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:18px}
.meter span{display:flex;justify-content:space-between;font-family:var(--f-hud);font-size:9.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.meter div{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.meter div i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--pink));box-shadow:0 0 10px var(--accent);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.alts{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.6}
.alts b{color:var(--ink);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.actions .btn{font-size:15px;padding:13px 14px}
.actions .wide{grid-column:span 2}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:20;background:rgba(20,18,50,.9);border:1px solid var(--line);
  padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:all .35s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Starry ---------- */
#starry{position:fixed;left:0;top:0;z-index:6;width:clamp(100px,17vw,150px);cursor:pointer;perspective:600px;will-change:transform;-webkit-tap-highlight-color:transparent}
#starry .tilt,#starry .spinner{transform-style:preserve-3d}
#starry .spinner.spin{animation:spin 1.3s cubic-bezier(.45,.05,.25,1)}
@keyframes spin{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(540deg) scale(1.15)}100%{transform:rotateY(1080deg) scale(1)}}
#starry svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 0 18px rgba(170,190,255,.45))}
#armR{transform-box:view-box;transform-origin:122px 142px}
svg.waving #armR{animation:wave 1.6s ease-in-out}
@keyframes wave{0%{transform:rotate(0)}15%{transform:rotate(-100deg)}30%{transform:rotate(-122deg)}45%{transform:rotate(-96deg)}60%{transform:rotate(-122deg)}75%{transform:rotate(-96deg)}88%{transform:rotate(-112deg)}100%{transform:rotate(0)}}
.closed{opacity:0}
svg.blink .open,svg.wink #eyeL .open{opacity:0}
svg.blink .closed,svg.wink #eyeL .closed{opacity:1}
.ring{animation:dash 7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-72}}
.twk{animation:twk 2.4s ease-in-out infinite}
.twk:nth-of-type(2){animation-delay:.6s}.twk:nth-of-type(3){animation-delay:1.2s}.twk:nth-of-type(4){animation-delay:1.8s}
@keyframes twk{0%,100%{opacity:.2}50%{opacity:1}}

#bubble{position:fixed;left:0;top:0;z-index:7;max-width:260px;padding:12px 15px;border-radius:18px 18px 18px 6px;
  background:rgba(255,255,255,.93);color:#25204f;font-family:var(--f-cute);font-weight:500;font-size:14.5px;line-height:1.4;
  box-shadow:0 10px 30px -8px rgba(159,184,255,.7);pointer-events:none;opacity:0;transition:opacity .3s;will-change:transform}
#bubble.on{opacity:1}
#bubble.left{border-radius:18px 18px 6px 18px}

#share{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,4,20,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px}
#share.on{display:flex;animation:in .35s ease}
.sheet{position:relative;width:min(400px,100%);max-height:100%;overflow:auto;border-radius:24px;padding:18px;background:linear-gradient(160deg,rgba(40,36,96,.92),rgba(14,12,40,.95));border:1px solid var(--line);box-shadow:0 30px 80px -20px #000}
.sheet h3{font-family:var(--f-cute);font-weight:500;font-size:20px;margin:0 0 12px;padding-right:36px}
.sheet .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;font-size:16px}
.prev{display:flex;align-items:center;justify-content:center;min-height:200px;border-radius:16px;background:rgba(255,255,255,.04);overflow:hidden}
.prev img{width:100%;max-height:50vh;object-fit:contain;display:block}
.prev .mk{font-family:var(--f-hud);font-size:10px;letter-spacing:.3em;color:var(--muted)}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sheet .row .btn{font-size:15px;padding:13px 12px;margin:0}
.sheet .row .wide{grid-column:span 2}
.btn.wa{background:#25D366;color:#06311a}
.btn.wa:hover{transform:translateY(-2px);box-shadow:0 10px 26px -8px #25D366}
.hint{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.hint b{color:var(--ink)}
@media (max-width:480px){
  #card{padding:22px 18px 20px}
  .opt{min-height:80px;padding:12px;font-size:13.5px}
  .brand span{display:none}
  #bubble{max-width:200px;font-size:13.5px}
}
@media (max-height:700px){ .lead{font-size:14px} h1{margin:8px 0 6px} }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="trail"></canvas>
<div id="flash"></div>

<header>
  <div class="brand"><b>✦ Starry</b><span>SONG ORACLE</span></div>
  <div class="lang" id="lang" data-l="id">
    <div class="pill"></div>
    <button data-l="id" class="on">ID</button>
    <button data-l="en">EN</button>
  </div>
</header>

<div id="starry" aria-label="Starry">
  <div class="tilt"><div class="spinner">
  <svg id="starrySvg" viewBox="0 0 200 270" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="hairG" cx="40%" cy="30%" r="80%">
        <stop offset="0" stop-color="#f6f8ff"/><stop offset=".45" stop-color="#bcd2ff"/>
        <stop offset=".8" stop-color="#9eb2ff"/><stop offset="1" stop-color="#c9a9ff"/>
      </radialGradient>
      <linearGradient id="hairTail" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#bcd2ff"/><stop offset=".55" stop-color="#e0b9ff"/><stop offset="1" stop-color="#ffc2e4" stop-opacity=".2"/>
      </linearGradient>
      <radialGradient id="skin" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#fff5f0"/><stop offset="1" stop-color="#ffe0d8"/></radialGradient>
      <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4e6ff"/><stop offset="1" stop-color="#84b5f2"/></linearGradient>
      <radialGradient id="eyeG" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="#7c9ae0"/><stop offset="1" stop-color="#2b3870"/></radialGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>

    <ellipse class="ring" cx="100" cy="150" rx="94" ry="22" fill="none" stroke="rgba(225,232,255,.45)" stroke-width="1.3" stroke-dasharray="2 6" transform="rotate(-14 100 150)"/>

    <!-- cosmic hair tail -->
    <path d="M112 46 C140 20 170 8 199 2 C190 30 172 56 146 82 C134 72 122 60 112 46Z" fill="url(#hairTail)" filter="url(#glow)" opacity=".9"/>
    <path d="M112 46 C140 20 170 8 199 2 C190 30 172 56 146 82 C134 72 122 60 112 46Z" fill="url(#hairTail)" opacity=".75"/>
    <!-- hair back -->
    <path d="M50 92 C46 50 74 30 102 30 C134 30 156 52 152 94 C152 118 146 132 140 138 L60 138 C54 130 50 116 50 92Z" fill="url(#hairG)" filter="url(#glow)" opacity=".7"/>
    <path d="M50 92 C46 50 74 30 102 30 C134 30 156 52 152 94 C152 118 146 132 140 138 L60 138 C54 130 50 116 50 92Z" fill="url(#hairG)"/>

    <!-- legs -->
    <rect x="87" y="208" width="9" height="36" rx="4.5" fill="url(#skin)"/>
    <rect x="104" y="208" width="9" height="36" rx="4.5" fill="url(#skin)"/>
    <ellipse cx="91" cy="246" rx="7.5" ry="4.2" fill="#8ea8ee"/>
    <ellipse cx="109" cy="246" rx="7.5" ry="4.2" fill="#8ea8ee"/>

    <!-- left arm -->
    <path d="M80 142 Q65 160 62 182" stroke="#ffe4dc" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="62" cy="184" r="5.5" fill="#ffe4dc"/>

    <!-- dress -->
    <path d="M80 134 Q100 128 120 134 L128 150 Q136 180 146 212 Q131 220 116 214 Q100 222 86 214 Q70 220 54 212 Q64 180 72 150 Z" fill="url(#dress)"/>
    <path d="M70 196 Q100 204 132 196" stroke="rgba(255,255,255,.35)" stroke-width="1.5" fill="none"/>
    <ellipse cx="78" cy="143" rx="11" ry="9" fill="#acd4fb"/>

    <!-- head -->
    <g id="head">
      <ellipse cx="100" cy="92" rx="44" ry="40" fill="url(#skin)"/>
      <path d="M56 92 C54 58 78 42 102 42 C128 42 148 60 144 92 C138 78 130 70 124 66 C122 76 114 80 106 78 C108 72 106 66 104 64 C96 74 84 80 70 80 C66 84 60 88 56 92Z" fill="url(#hairG)"/>
      <path d="M56 88 C52 110 56 126 64 134 C62 118 62 104 60 92Z" fill="url(#hairG)"/>
      <path d="M144 88 C148 110 144 126 136 134 C138 118 138 104 140 92Z" fill="url(#hairG)"/>
      <circle class="twk" cx="72" cy="58" r="1.6" fill="#fff"/>
      <circle class="twk" cx="128" cy="54" r="1.3" fill="#fff"/>
      <circle class="twk" cx="160" cy="34" r="1.5" fill="#fff"/>
      <circle class="twk" cx="182" cy="16" r="1.2" fill="#fff"/>
      <!-- star tiara -->
      <g fill="#fff6c9" style="filter:drop-shadow(0 0 4px #fff3a8)">
        <path d="M100 30 L102.6 37 L109.5 39.5 L102.6 42 L100 49 L97.4 42 L90.5 39.5 L97.4 37Z"/>
        <path d="M86 40 L87.4 43.6 L91 45 L87.4 46.4 L86 50 L84.6 46.4 L81 45 L84.6 43.6Z"/>
        <path d="M114 40 L115.4 43.6 L119 45 L115.4 46.4 L114 50 L112.6 46.4 L109 45 L112.6 43.6Z"/>
      </g>
      <g id="eyeL">
        <g class="open"><ellipse cx="82" cy="98" rx="7.5" ry="9.5" fill="url(#eyeG)"/><circle cx="84.5" cy="94" r="2.8" fill="#fff"/><circle cx="80" cy="101.5" r="1.3" fill="#fff" opacity=".8"/></g>
        <path class="closed" d="M74 101 Q82 93 90 101" stroke="#2b3870" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </g>
      <g id="eyeR">
        <g class="open"><ellipse cx="118" cy="98" rx="7.5" ry="9.5" fill="url(#eyeG)"/><circle cx="120.5" cy="94" r="2.8" fill="#fff"/><circle cx="116" cy="101.5" r="1.3" fill="#fff" opacity=".8"/></g>
        <path class="closed" d="M110 101 Q118 93 126 101" stroke="#2b3870" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </g>
      <ellipse cx="71" cy="112" rx="8" ry="5" fill="#ff9fb8" opacity=".55"/>
      <ellipse cx="129" cy="112" rx="8" ry="5" fill="#ff9fb8" opacity=".55"/>
      <path d="M94 113 Q100 119 106 113" stroke="#d9647e" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- right (waving) arm -->

function region(){

function stepStarry(t,now){
  if(now>st.next){const r=region();st.tx=r.x0+Math.random()*(r.x1-r.x0);st.ty=r.y0+Math.random()*(r.y1-r.y0);st.next=now+2500+Math.random()*2200;}
  st.vx=(st.vx+(st.tx-st.x)*.012)*.92;st.vy=(st.vy+(st.ty-st.y)*.012)*.92;
  st.x+=st.vx;st.y+=st.vy;
  const bob=Math.sin(t*2.1)*7;
  starEl.style.transform=`translate3d(${st.x}px,${st.y+bob}px,0)`;
  const ry=Math.max(-35,Math.min(35,st.vx*4)),rz=Math.max(-12,Math.min(12,st.vx*1.3));
  tiltEl.style.transform=`rotateY(${ry}deg) rotateZ(${rz}deg)`;
  // bubble
  const w=starEl.offsetWidth,bw=bubble.offsetWidth,W=innerWidth;
  let bx=st.x+w*.82,by=st.y+bob-8;let left=false;
  if(bx+bw>W-8){bx=st.x-bw+w*.18;left=true;}
  bx=Math.max(8,bx);by=Math.max(58,by);
  bubble.classList.toggle('left',left);
  bubble.style.transform=`translate3d(${bx}px,${by}px,0)`;
  // trail
  const speed=Math.hypot(st.vx,st.vy);
  emitAcc+=.22+speed*.15;
  const h=starEl.offsetHeight;
  while(emitAcc>1){emitAcc--;emit(st.x+w*(.55+Math.random()*.38),st.y+bob+h*(.03+Math.random()*.25),(Math.random()-.5)*.6-st.vx*.15,(Math.random()-.5)*.6-st.vy*.15);}
}

const tc=document.getElementById('trail'),tx=tc.getContext('2d');let parts=[],emitAcc=0;

function emit(x,y,vx,vy,big){parts.push({x,y,vx,vy,life:0,max:50+Math.random()*50,size:(big?2:1)*(0.6+Math.random()*1.3),c:PCOL[Math.floor(Math.random()*PCOL.length)]});}
function burst(n){const w=starEl.offsetWidth,h=starEl.offsetHeight;const cx=st.x+w/2,cy=st.y+h/2;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*5;emit(cx,cy,Math.cos(a)*s,Math.sin(a)*s,true);}}

  tx.clearRect(0,0,tc.width,tc.height);tx.globalCompositeOperation='lighter';
  parts=parts.filter(p=>p.life<p.max);

  // starfield
  const N=innerWidth<600?1800:3200,pos=new Float32Array(N*3),col=new Float32Array(N*3),size=new Float32Array(N),ph=new Float32Array(N);
  const cols=['#ffffff','#cfdcff','#e3ccff','#ffd1ea','#c8f5ec'].map(c=>new THREE.Color(c));
  for(let i=0;i<N;i++){
    const r=90+Math.random()*420,th=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(phi)*Math.cos(th);pos[i*3+1]=r*Math.sin(phi)*Math.sin(th);pos[i*3+2]=r*Math.cos(phi);
    const c=cols[Math.floor(Math.random()*cols.length)];col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    size[i]=Math.random()<.04?5+Math.random()*3:1+Math.random()*2.6;ph[i]=Math.random()*10;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(size,1));g.setAttribute('aPhase',new THREE.BufferAttribute(ph,1));
  starMat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0},uPR:{value:renderer.getPixelRatio()}},
    vertexShader:`attribute vec3 aColor;attribute float aSize;attribute float aPhase;uniform float uTime;uniform float uPR;varying vec3 vC;varying float vT;
      void main(){vC=aColor;vT=.55+.45*sin(uTime*1.6+aPhase);vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*uPR*vT*(320./-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;varying float vT;void main(){float d=length(gl_PointCoord-.5);float a=pow(smoothstep(.5,0.,d),1.7);gl_FragColor=vec4(vC,a*(.4+.6*vT));}`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
  });
  stars=new THREE.Points(g,starMat);scene.add(stars);

  // nebula clouds
  const nt=radialTex([[0,'rgba(255,255,255,1)'],[.35,'rgba(255,255,255,.35)'],[1,'rgba(255,255,255,0)']]);
  for(let i=0;i<8;i++){
    const m=new THREE.SpriteMaterial({map:nt,color:(i%2?pal.c2:pal.c1).clone(),transparent:true,opacity:.16+Math.random()*.12,blending:THREE.AdditiveBlending,depthWrite:false});
    const s=new THREE.Sprite(m);const sc=140+Math.random()*180;s.scale.set(sc,sc*.7,1);
    s.position.set((Math.random()-.5)*300,(Math.random()-.5)*160,-130-Math.random()*120);
    s.userData={k:i%2,sp:(Math.random()-.5)*.0006,ox:s.position.x};
    scene.add(s);nebulas.push(s);
  }

  // constellation group
  glowTex=radialTex([[0,'rgba(255,255,255,1)'],[.18,'rgba(255,255,255,.9)'],[.4,'rgba(200,215,255,.25)'],[1,'rgba(200,215,255,0)']]);
  constel=new THREE.Group();constel.position.set(0,7,0);scene.add(constel);
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(10*3),3));lg.setDrawRange(0,0);
  constLine=new THREE.Line(lg,new THREE.LineBasicMaterial({color:0xdfe6ff,transparent:true,opacity:.55,blending:THREE.AdditiveBlending}));
  constel.add(constLine);
  [[19,1.15,0],[27,1.35,.6]].forEach(([r,rx,rz])=>{
    const pts=new THREE.EllipseCurve(0,0,r,r,0,Math.PI*2).getPoints(160).map(p=>new THREE.Vector3(p.x,p.y,0));
    const ring=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:pal.c1.clone(),transparent:true,opacity:.22,blending:THREE.AdditiveBlending}));
    ring.rotation.set(rx,0,rz);constel.add(ring);rings.push(ring);
  });
  resize();
}
function addStar(){
  const i=constPts.length,a=i/QN*Math.PI*2+Math.random()*.5,r=9+Math.random()*8;
  const p=new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r*.75,(Math.random()-.5)*10);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  s.position.copy(p);s.scale.set(.01,.01,1);s.userData={born:performance.now()};constel.add(s);constPts.push(s);
  const arr=constLine.geometry.attributes.position.array;arr[i*3]=p.x;arr[i*3+1]=p.y;arr[i*3+2]=p.z;
  constLine.geometry.attributes.position.needsUpdate=true;constLine.geometry.setDrawRange(0,i+1);
}
function clearConstellation(){constPts.forEach(s=>{constel.remove(s);s.material.dispose();});constPts=[];if(constLine)constLine.geometry.setDrawRange(0,0);}
function updatePalette(){
  const p=profile();
  const blue=new THREE.Color('#6f8cff'),pink=new THREE.Color('#ff9fd6'),lav=new THREE.Color('#b79cff'),mint=new THREE.Color('#8ff0d8');
  pal.t1.copy(blue).lerp(pink,p.v);pal.t2.copy(lav).lerp(mint,Math.max(0,(p.e-.3)/.7));
  document.documentElement.style.setProperty('--accent','#'+pal.t1.clone().lerp(new THREE.Color('#ffffff'),.25).getHexString());
  document.documentElement.style.setProperty('--accent2','#'+pal.t2.getHexString());
}
function revealFx(){fx.warpT=1;setTimeout(()=>fx.warpT=0,2100);}
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  const dpr=Math.min(devicePixelRatio,2);tc.width=w*dpr;tc.height=h*dpr;tx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);
addEventListener('pointermove',e=>{fx.pointerX=e.clientX/innerWidth-.5;fx.pointerY=e.clientY/innerHeight-.5;});

/* ================= LOOP ================= */
const t0=performance.now();
function loop(now){
  const t=(now-t0)/1000;
  fx.warp+=(fx.warpT-fx.warp)*.05;
  starMat.uniforms.uTime.value=t;
  stars.rotation.y+= .00025+fx.warp*.012; stars.rotation.x+=.00008+fx.warp*.003;
  pal.c1.lerp(pal.t1,.02);pal.c2.lerp(pal.t2,.02);
  nebulas.forEach(s=>{s.material.color.lerp(s.userData.k?pal.c2:pal.c1,.03);s.material.rotation+=s.userData.sp;s.position.x=s.userData.ox+Math.sin(t*.05+s.userData.ox)*8;});
  rings.forEach((r,i)=>{r.rotation.z+=(i?-.0015:.002)*(1+fx.warp*15);r.material.color.lerp(pal.c1,.03);});
  constel.rotation.y=Math.sin(t*.25)*.35+fx.warp*t*3;
  constel.rotation.x=Math.sin(t*.18)*.12;
  const cs=1+fx.warp*.35;constel.scale.set(cs,cs,cs);
  constPts.forEach((s,i)=>{const age=Math.min(1,(now-s.userData.born)/700);const e=1-Math.pow(1-age,3);const k=(2.6+Math.sin(t*3+i)*.4)*e*(1+fx.warp);s.scale.set(k,k,1);});
  camera.position.x+=(fx.pointerX*8-camera.position.x)*.03;
  camera.position.y+=(-fx.pointerY*5-camera.position.y)*.03;
  camera.position.z+=((60-fx.warp*22)-camera.position.z)*.05;
  camera.lookAt(0,2,0);
  renderer.render(scene,camera);
  stepStarry(t,now);drawTrail();
  requestAnimationFrame(loop);
}

/* ================= BOOT ================= */
setLang(S.lang);
initThree();updatePalette();renderIntro();
st.next=performance.now()+1800;st.tx=Math.min(innerWidth*.18,160);st.ty=110;
setTimeout(()=>{say(L().hello);wave();},900);
requestAnimationFrame(loop);
</script>
</body>
