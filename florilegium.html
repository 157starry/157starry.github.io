<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Florilegium · s(T☆R)light</title>
  <meta name="description" content="A gathering of flowers: words I picked up along the way.">
  <meta name="theme-color" content="#F6E9E9">
  <meta property="og:title" content="Florilegium · s(T☆R)light">
  <meta property="og:image" content="https://157starry.github.io/assets/og-image.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .seeall{display:inline-block;margin:14px 0 4px;background:none;border:0;padding:0;font:inherit;font-size:14px;color:#8F5864;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  </style>
</head>
<body>
  <main class="page wide">
    <a class="back" href="./">← back to the sky</a>
    <h1 class="h1">Flori<i>legium</i></h1>
    <p class="lede">A gathering of flowers: words I picked up along the way.</p>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-t="all">All</button>
      <button role="tab" aria-selected="false" data-t="quote">Quotes</button>
      <button role="tab" aria-selected="false" data-t="book">Shelf</button>
      <button role="tab" aria-selected="false" data-t="read">Reads</button>
    </div>
    <div class="chips" id="genres" style="display:none"></div>
    <div id="out"><div class="empty">Loading…</div></div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
  <script src="common.js"></script>
  <script>
  (async function () {
    const { sb, esc, safeUrl, platform, tint } = SL;
    let items = [], tab = "all";
    if (sb) {
      const { data } = await sb.from("star_flori").select("*")
        .order("position", { ascending: true }).order("created_at", { ascending: false });
      items = data || [];
    }
    let genre = "All";
    const genresOf = (x) => String(x.genre || "").split(",").map((g) => g.trim()).filter(Boolean);
    const favColor = (u) => { const p = platform(u); return p === "Substack" ? "#e07a3c" : p === "Medium" ? "#2f2f2f" : "#B07A86"; };

    const quoteHtml = (x) => `<div class="card quote">“${esc(x.title)}”
      ${x.author ? `<small>${esc(x.author)}</small>` : ""}${x.note ? `<span class="why">${esc(x.note)}</span>` : ""}</div>`;
    const bookHtml = (x) => {
      const img = safeUrl(x.image_url);
      const tag = safeUrl(x.url) ? "a" : "div";
      return `<${tag} class="book" ${tag === "a" ? `href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener"` : ""}>
        <div class="cover" style="${img ? `background-image:url('${esc(img)}')` : `background:linear-gradient(160deg,${tint(x.title)},#8F5864)`}">${img ? "" : esc(x.title)}</div>
        <b>${esc(x.title)}</b>${x.author ? `<span class="by">${esc(x.author)}</span>` : ""}${genresOf(x).length ? `<span class="gen">${esc(genresOf(x).join(" · "))}</span>` : ""}${x.note ? `<span class="why clamp">${esc(x.note)}</span>` : ""}</${tag}>`;
    };
    const readHtml = (x) => {
      const u = safeUrl(x.url), p = platform(u);
      return `<a class="link" href="${esc(u)}" target="_blank" rel="noopener">
        <div class="fav" style="background:${favColor(u)}">${esc(p[0] || "↗").toUpperCase()}</div>
        <div><b>${esc(x.title)}</b><span>${esc(p)}${x.author ? " · " + esc(x.author) : ""}</span>${x.note ? `<span class="why">${esc(x.note)}</span>` : ""}</div>
        <span class="arr">↗</span></a>`;
    };

    function setTab(t) {
      tab = t;
      document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.t === t)));
    }

    function render() {
      const q = items.filter((x) => x.kind === "quote"), b = items.filter((x) => x.kind === "book"), r = items.filter((x) => x.kind === "read");
      const none = `<div class="empty">Nothing picked yet.<br><span class="scribble">flowers coming soon ✧</span></div>`;
      let html = "";
      if (tab === "all") {
        if (q.length) html += q.slice(0, 3).map(quoteHtml).join("");
        if (b.length) {
          // ♡ books you chose in the admin; if none are chosen yet, the first 6 on your shelf
          const picks = b.some((x) => x.featured) ? b.filter((x) => x.featured) : b.slice(0, 6);
          html += `<div class="sec">On my shelf <span class="hand">I'd recommend ♡</span></div><div class="shelf">${picks.map(bookHtml).join("")}</div>`;
          if (b.length > picks.length) html += `<button class="seeall" data-go="book">See the whole shelf (${b.length} books) →</button>`;
        }
        if (r.length) html += `<div class="sec">Good reads <span class="hand">worth your time</span></div>${r.slice(0, 5).map(readHtml).join("")}`;
      } else if (tab === "quote") html = q.map(quoteHtml).join("");
      else if (tab === "book") {
        const shown = b.filter((x) => genre === "All" || genresOf(x).map((g) => g.toLowerCase()).includes(genre.toLowerCase()));
        html = shown.length ? `<div class="shelf">${shown.map(bookHtml).join("")}</div>` : "";
      }
      else html = r.map(readHtml).join("");

      // genre chips: shown on All and Shelf. On All, a genre opens the Shelf filtered by it.
      const names = new Map();
      b.flatMap(genresOf).forEach((g) => {
        const k = g.toLowerCase(), had = names.get(k);
        if (!had || (had === had.toUpperCase() && g !== g.toUpperCase())) names.set(k, g); // prefer "Science" over "SCIENCE"
      });
      const all = ["All", ...names.values()];
      const gEl = document.getElementById("genres");
      gEl.style.display = (tab === "book" || tab === "all") && all.length > 1 ? "" : "none";
      gEl.innerHTML = all.map((g) => `<button class="chip" aria-pressed="${tab === "book" && g.toLowerCase() === genre.toLowerCase() || tab === "all" && g === "All"}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
      gEl.querySelectorAll(".chip").forEach((c) => c.onclick = () => {
        genre = c.dataset.g;
        if (tab === "all" && genre !== "All") setTab("book");
        render();
      });

      document.getElementById("out").innerHTML = html || none;
      document.querySelectorAll("#out [data-go]").forEach((btn) => btn.onclick = () => { genre = "All"; setTab(btn.dataset.go); render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
      // tap a long note to read it all
      document.querySelectorAll("#out .why.clamp").forEach((n) => n.onclick = (e) => {
        if (n.scrollHeight > n.clientHeight + 2 || n.classList.contains("expanded")) { e.preventDefault(); e.stopPropagation(); n.classList.toggle("expanded"); }
      });
    }
    document.querySelectorAll(".tabs button").forEach((t) => t.onclick = () => { genre = "All"; setTab(t.dataset.t); render(); });
    render();
  })();
  </script>
</body>
</html>
