<html lang="en">

  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Courier+Prime:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .h1{font-size:clamp(40px,10vw,64px)}
    /* tabs + language */
    .ftop{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px 20px;border-bottom:1px solid var(--line);margin:0 0 18px}
    .ftabs{display:flex;gap:26px;flex-wrap:wrap}
    .ftabs button{font-family:var(--serif-display);font-weight:700;font-size:21px;padding:0 0 8px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
    .ftabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mauve)}
    .ftabs button:focus-visible,.seg button:focus-visible,.fcard:focus-visible,.opt:focus-visible{outline:2px solid var(--mauve);outline-offset:3px}
    .seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:8px}
    .seg button{border-radius:999px;padding:0 14px;min-height:34px;color:var(--ink)}
    .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
    @media (max-width:520px){.ftabs{gap:16px}.ftabs button{font-size:18px}}
    .flede{font-family:var(--hand);font-size:25px;color:var(--mauve);margin:0 0 14px}
    /* explorer */
    .tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
    .search{flex:1 1 240px;max-width:360px;font-family:var(--sans);font-size:14px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
    .search:focus{outline:2px solid var(--mauve);outline-offset:1px}
    .tools .chips{margin:0}
    .chip .dot,.fk .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
    .count{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:auto}
    .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
    .fcard{display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;background:var(--card);border:1px solid #EADADC;border-radius:18px;padding:18px 18px 20px;min-height:170px;transition:transform .15s,box-shadow .15s}
    .fcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(58,42,46,.08)}
    .fk{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-family:var(--sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
    .fk>span:last-child{white-space:nowrap}
    .fcard h3{font-family:var(--serif-display);font-weight:700;font-size:21px;line-height:1.15}
    .fcard .alt{font-style:italic;font-size:13.5px;color:var(--mauve-d);margin-top:-4px}
    .fcard p{font-size:13.5px;line-height:1.5;color:var(--muted)}
    /* sheet */
    .fmodal{position:fixed;inset:0;z-index:85;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
    .fmodal[hidden]{display:none}
    .fmback{position:fixed;inset:0;background:rgba(58,42,46,.42)}
    .fsheet{position:relative;width:min(880px,100%);margin:auto 0;background:var(--paper-2);border-radius:22px;padding:30px 32px 32px;box-shadow:0 24px 60px rgba(14,17,32,.25)}
    @media (max-width:560px){.fsheet{padding:22px 18px 24px}}
    .fshd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
    .fnav{display:flex;gap:8px}
    .fnav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:17px}
    .fnav button.x{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
    .fsheet h2{font-family:var(--serif-display);font-weight:900;font-size:clamp(30px,7vw,48px);line-height:1.05;letter-spacing:-.5px;margin-top:16px}
    .fsheet .alt{font-family:var(--serif-display);font-style:italic;font-size:20px;color:var(--mauve-d);margin-top:4px}
    .fsheet .def{font-style:italic;font-size:18px;line-height:1.55;color:#4E3D42;margin-top:12px}
    .boxes{display:flex;flex-wrap:wrap;gap:14px;margin-top:22px}
    .box{flex:1 1 300px;background:#fff;border:1px solid #EADADC;border-radius:16px;padding:18px 20px}
    .box.w{flex-basis:100%}
    .box .lb{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mauve-d)}
    .box p{font-size:15.5px;line-height:1.65;margin-top:8px}
    .box.bad{background:#FBEDEF;border-color:transparent}
    .box.bad .lb{color:#9A4F5E}
    .box.good{background:var(--matcha-l);border-color:transparent}
    .box.good .lb{color:#4F6A3A}
    .box.bad p,.box.good p{font-family:var(--hand);font-size:25px;line-height:1.25}
    /* quiz */
    .qwrap{max-width:760px;margin:0 auto}
    .qhead{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .qhead b{font-family:var(--serif-display);font-size:22px;letter-spacing:0;color:var(--ink);text-transform:none}
    .bar{height:6px;border-radius:999px;background:var(--mauve-l);margin:10px 0 18px;overflow:hidden}
    .bar i{display:block;height:100%;background:var(--mauve);transition:width .3s}
    .qcard{background:var(--card);border:1px solid #EADADC;border-radius:20px;padding:24px 24px 26px}
    .qcard .ask{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mauve-d)}
    .qcard .q{font-family:var(--hand);font-size:29px;line-height:1.25;margin:10px 0 20px}
    .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    @media (max-width:560px){.opts{grid-template-columns:1fr}}
    .opt{text-align:left;padding:14px 16px;min-height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;font-family:var(--serif);font-size:15px;transition:border-color .15s,background .15s}
    .opt:hover:not(:disabled){border-color:var(--mauve)}
    .opt:disabled{cursor:default}
    .opt.ok{background:var(--matcha-l);border-color:var(--matcha);color:#33472A}
    .opt.no{background:#FBEDEF;border-color:#C97C8B;color:#7E3C4B}
    .opt .mk{float:right;font-family:var(--sans);font-weight:700}
    .fb{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--paper-2);border:1px dashed var(--line);font-size:14.5px;line-height:1.6}
    .fb b{font-family:var(--serif-display)}
    .qact{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
    .btn{font-family:var(--sans);font-size:14px;padding:0 20px;min-height:44px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);background:transparent}
    .btn.dark{background:var(--ink);color:#fff}
    .btn:focus-visible{outline:2px solid var(--mauve);outline-offset:3px}
    .res{text-align:center;padding:10px 0}
    .res .big{font-family:var(--serif-display);font-weight:900;font-size:64px;line-height:1}
    .res .msg{font-family:var(--hand);font-size:28px;color:var(--mauve);margin-top:8px}
    .res p{color:var(--muted);margin-top:8px}
    /* detector */
    .din{width:100%;min-height:150px;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-family:var(--serif);font-size:16px;line-height:1.6;resize:vertical;color:var(--ink)}
    .din:focus{outline:2px solid var(--mauve);outline-offset:1px}
    .dact{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
    .dact .try{font-family:var(--sans);font-size:12px;color:var(--muted)}
    .dact .try button{font-family:var(--sans);font-size:12px;color:var(--mauve-d);text-decoration:underline;text-underline-offset:3px;padding:4px 2px}
    .dres{margin-top:16px;display:grid;gap:10px}
    .hit{background:var(--card);border:1px solid #EADADC;border-radius:16px;padding:16px 18px}
    .hit h4{font-family:var(--serif-display);font-size:19px}
    .hit .why{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.55}
    .hit mark{background:var(--mauve-l);color:var(--ink);padding:0 3px;border-radius:3px}
    .hit .open{font-family:var(--sans);font-size:12px;color:var(--mauve-d);text-decoration:underline;text-underline-offset:3px;margin-top:8px;padding:4px 0}
    .note{font-size:13.5px;color:var(--muted);line-height:1.6;background:var(--paper-2);border-radius:14px;padding:12px 16px;margin-top:6px}
    /* guide */
    .gsec{background:var(--card);border:1px solid #EADADC;border-radius:18px;padding:22px 24px;margin-bottom:14px}
    .gsec h3{font-family:var(--serif-display);font-weight:700;font-size:22px;margin-bottom:8px}
    .gsec p,.gsec li{font-size:15.5px;line-height:1.7}
    .gsec ul{padding-left:1.2em}
    .gcats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
    .gcat{border-radius:14px;background:var(--paper-2);padding:14px 16px;text-align:left;width:100%;border:1px solid transparent}
    .gcat:hover{border-color:var(--line)}
    .gcat b{font-family:var(--serif-display);font-size:18px}
    .gcat .n{font-family:var(--sans);font-size:11px;color:var(--muted);float:right;margin-top:4px}
    .gcat p{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.5}

    /* ===== lab notebook skin ===== */
    :root{--mono:"Courier Prime","Courier New",monospace;--stamp:#A8485A}
    body{background-color:#F6ECEA;background-image:linear-gradient(rgba(176,122,134,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(176,122,134,.11) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed}
    .back,.mast .k,.fk,.count,.chip,.seg,.box .lb,.qhead,.qcard .ask,.search,.dact .try,.dact .try button,.hit .open,.gcat .n{font-family:var(--mono)!important}
    .mast .k{letter-spacing:.12em}
    .ftabs button{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;padding-bottom:10px}
    .flede{font-size:24px}
    /* folders */
    .fgrid{gap:26px 18px;padding-top:12px}
    .fcard{position:relative;border-radius:2px 14px 14px 14px;border:1px solid #E6D3D6;background:#FFFBF8;box-shadow:0 1px 0 #EADADC,0 3px 0 -1px #F6ECEA,0 4px 0 -1px #E6D3D6;padding-top:20px}
    .fcard::before{content:"";position:absolute;left:-1px;top:-11px;width:96px;height:12px;background:var(--c);border-radius:8px 8px 0 0;opacity:.85;clip-path:polygon(0 100%,10% 0,90% 0,100% 100%)}
    .fcard::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);opacity:.55;border-radius:2px 14px 0 0}
    .fcard:hover{transform:translateY(-3px) rotate(-.4deg)}
    .fk .case{border:1.5px solid var(--stamp);color:var(--stamp);border-radius:4px;padding:2px 6px;transform:rotate(4deg);font-weight:700;letter-spacing:.12em}
    .fcard h3{margin-top:2px}
    /* case file sheet */
    .fsheet{border-radius:4px 22px 22px 22px;border-top:6px solid var(--c);background:#FFFBF8 repeating-linear-gradient(transparent 0 31px,rgba(176,122,134,.10) 31px 32px)}
    .fsheet .fk{color:var(--stamp)}
    .box{border-radius:6px;position:relative}
    .box.bad::after,.box.good::after{position:absolute;top:12px;right:14px;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.16em;padding:3px 8px;border:2px solid;border-radius:4px;transform:rotate(-6deg);opacity:.85}
    .box.bad::after{content:"FLAWED";color:var(--stamp)}
    .box.good::after{content:"SOUND";color:#4F6A3A}
    /* quiz index card */
    .qcard{border-radius:4px;background:#FFFBF8 repeating-linear-gradient(transparent 0 35px,rgba(110,127,163,.16) 35px 36px);border-top:3px solid #C97C8B}
    .opt{border-radius:6px;font-family:var(--mono);font-size:14px}
    /* detector: lined paper */
    .din{border-radius:4px;background:#FFFBF8 repeating-linear-gradient(transparent 0 25px,rgba(110,127,163,.18) 25px 26px);line-height:26px;padding-top:8px}
    .hit{border-radius:6px;border-left:0;border-top:3px solid var(--stamp)}
    .gsec,.gcat{border-radius:6px}
    @media (prefers-reduced-motion:reduce){.fcard,.bar i{transition:none}}
  </style>

<body>
  <main class="page wide">
    <a class="back" href="lab.html">← Starry Lab</a>
    <div class="mast"><div class="k">s(T☆R)light<br>starry lab</div><div class="k" style="text-align:right">critical thinking<br>a little lab</div></div>
    <div class="head-row">
      <div><h1 class="h1">Logical <i>Fallacies</i></h1><p class="lede" id="tLede">Master the art of spotting flawed reasoning.</p></div>
      <span class="scribble circle" style="margin-top:14px" id="tScribble">think twice,<br>argue kindly</span>
    </div>

    <div class="ftop">
      <div class="ftabs" role="tablist">
        <button role="tab" aria-selected="true" data-m="explorer" id="tbExplorer">Explorer</button>
        <button role="tab" aria-selected="false" data-m="quiz" id="tbQuiz">Quiz</button>
        <button role="tab" aria-selected="false" data-m="detector" id="tbDetector">Detector</button>
        <button role="tab" aria-selected="false" data-m="guide" id="tbGuide">Guide</button>
      </div>
      <div class="seg" role="group" aria-label="Language"><button data-l="en" aria-pressed="true">EN</button><button data-l="id" aria-pressed="false">ID</button></div>
    </div>

    <section id="explorer">
      <p class="flede" id="eLede"></p>
      <div class="tools">
        <input class="search" id="q" type="search" aria-label="Search">
        <div class="chips" id="cats"></div>
        <span class="count" id="count"></span>
      </div>
      <div class="fgrid" id="grid"></div>
    </section>

    <section id="quiz" hidden><div class="qwrap" id="quizBox"></div></section>

    <section id="detector" hidden>
      <p class="flede" id="dLede"></p>
      <textarea class="din" id="din" aria-label="Argument"></textarea>
      <div class="dact"><button class="btn dark" id="dGo"></button><span class="try" id="dTry"></span></div>
      <div class="dres" id="dRes"></div>
    </section>

    <section id="guide" hidden></section>
  </main>

  <div class="fmodal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Fallacy">
    <div class="fmback" data-close></div>
    <div class="fsheet" id="sheet"></div>
  </div>

  <script>
// 24 fallacies · EN + ID
const CATS = {
  relevance: { en: "Relevance", id: "Relevansi", dot: "#B07A86" },
  appeal: { en: "Appeal", id: "Daya Tarik", dot: "#C9965F" },
  informal: { en: "Informal", id: "Informal", dot: "#6F8A57" },
  formal: { en: "Formal", id: "Formal", dot: "#6E7FA3" },
};
const FALLACIES = [
  { id: "adhom", cat: "relevance", name: { en: "Ad Hominem", id: "Ad Hominem (Menyerang Pribadi)" },
    desc: { en: "Attacking the person making an argument instead of the argument itself.", id: "Menyerang pribadi orang yang berargumen, bukan argumennya." },
    bad: { en: "Why listen to her opinion on the budget? She can't even manage her own life.", id: "Ngapain dengerin pendapatnya soal anggaran? Hidupnya sendiri aja berantakan." },
    good: { en: "Her budget proposal leaves out maintenance costs, so the totals don't add up.", id: "Usulan anggarannya belum memasukkan biaya perawatan, jadi totalnya tidak cocok." },
    spot: { en: "Ask: is the reply about the claim, or about the person's character, looks, background or motives?", id: "Tanyakan: responsnya membahas klaim, atau karakter, penampilan, latar belakang, dan motif orangnya?" },
    life: { en: "Comment sections that answer a post with insults about the author.", id: "Kolom komentar yang membalas sebuah unggahan dengan hinaan ke pembuatnya." } },
  { id: "straw", cat: "relevance", name: { en: "Straw Man", id: "Straw Man (Manusia Jerami)" },
    desc: { en: "Twisting someone's argument into a weaker or more extreme version, then attacking that version.", id: "Memelintir argumen orang menjadi versi yang lebih lemah atau ekstrem, lalu menyerang versi itu." },
    bad: { en: "A: “We should eat less sugar.” B: “So you want to ban birthday cake for everyone?”", id: "A: “Kita sebaiknya mengurangi gula.” B: “Jadi kamu mau melarang semua orang makan kue ulang tahun?”" },
    good: { en: "“You mean cutting back, not cutting it out? How much less are you suggesting?”", id: "“Maksudmu mengurangi, bukan menghilangkan, ya? Seberapa banyak yang kamu sarankan?”" },
    spot: { en: "Compare what was actually said with what is being attacked. Would the original speaker agree with that summary?", id: "Bandingkan apa yang benar-benar dikatakan dengan apa yang diserang. Apakah pembicara aslinya setuju dengan ringkasan itu?" },
    life: { en: "Quotes cut out of context to make someone sound extreme.", id: "Kutipan yang dipotong dari konteksnya supaya seseorang terdengar ekstrem." } },
  { id: "herring", cat: "relevance", name: { en: "Red Herring", id: "Red Herring (Pengalihan Isu)" },
    desc: { en: "Bringing up an unrelated topic to pull attention away from the issue.", id: "Mengangkat topik lain yang tidak berkaitan untuk mengalihkan perhatian dari isu utama." },
    bad: { en: "A: “The office keeps missing deadlines.” B: “But look how nice the new lobby is!”", id: "A: “Kantor terus melewatkan tenggat.” B: “Tapi lihat, lobi barunya bagus, kan!”" },
    good: { en: "“The lobby is nice, but let's come back to the deadlines first.”", id: "“Lobinya memang bagus, tapi kita bahas tenggatnya dulu, ya.”" },
    spot: { en: "Ask: does this reply actually answer the point that was raised?", id: "Tanyakan: apakah respons ini benar-benar menjawab poin yang diangkat?" },
    life: { en: "Press conferences that answer a different question from the one asked.", id: "Konferensi pers yang menjawab pertanyaan lain dari yang diajukan." } },
  { id: "tuq", cat: "relevance", name: { en: "Tu Quoque", id: "Tu Quoque (“Kamu Juga”)" },
    desc: { en: "Dismissing a claim because the person making it doesn't follow it themselves.", id: "Menolak klaim karena orang yang menyampaikannya tidak menjalankannya sendiri." },
    bad: { en: "You say smoking is bad, but you smoke! So you're wrong.", id: "Kamu bilang merokok itu buruk, padahal kamu sendiri merokok! Jadi kamu salah." },
    good: { en: "“Fair point that you smoke, but the health risks are still real.”", id: "“Kamu memang merokok, tapi risiko kesehatannya tetap nyata.”" },
    spot: { en: "Hypocrisy says something about the person, not about whether the claim is true.", id: "Kemunafikan menunjukkan sesuatu tentang orangnya, bukan tentang benar-tidaknya klaim." },
    life: { en: "“You drive a car, so you can't talk about pollution.”", id: "“Kamu sendiri naik mobil, jadi nggak usah ngomongin polusi.”" } },
  { id: "whatabout", cat: "relevance", name: { en: "Whataboutism", id: "Whataboutism (“Terus Gimana dengan…?”)" },
    desc: { en: "Deflecting criticism by pointing to someone else's wrongdoing instead of answering it.", id: "Mengelak dari kritik dengan menunjuk kesalahan pihak lain, bukan menjawabnya." },
    bad: { en: "A: “Your team missed the deadline.” B: “What about the design team? They're always late!”", id: "A: “Timmu melewatkan tenggat.” B: “Terus gimana dengan tim desain? Mereka selalu telat!”" },
    good: { en: "“You're right, we missed it. Here's why, and here's the new date.”", id: "“Betul, kami terlambat. Ini alasannya, dan ini tanggal barunya.”" },
    spot: { en: "Notice when a criticism is answered with “but what about…?”. Both problems can be real at the same time.", id: "Perhatikan saat kritik dijawab dengan “terus gimana dengan…?”. Dua masalah bisa sama-sama nyata." },
    life: { en: "Online arguments where every criticism gets a counter-accusation.", id: "Debat online yang setiap kritiknya dibalas tuduhan balik." } },
  { id: "genetic", cat: "relevance", name: { en: "Genetic Fallacy", id: "Genetic Fallacy (Kekeliruan Asal-usul)" },
    desc: { en: "Judging a claim or idea only by where it came from, rather than on its merits.", id: "Menilai klaim atau gagasan hanya dari asal-usulnya, bukan dari isinya." },
    bad: { en: "That study tip came from a TikTok video, so it's useless.", id: "Tips belajar itu dari video TikTok, jadi pasti tidak berguna." },
    good: { en: "“It's from TikTok, so let's check whether it holds up before trying it.”", id: "“Asalnya dari TikTok, jadi kita cek dulu apakah tips itu terbukti sebelum dicoba.”" },

        def: "Definition", spot: "How to spot it", bad: "The fallacy", good: "A better response", life: "In real life",

        qAsk: "Which fallacy is this?", qOf: (i, n) => `Question ${i} of ${n}`, score: "Score", nextQ: "Next question →", finish: "See my result →", again: "Play again",
        right: "That's right.", wrong: "Not quite.", it: (n) => `It's ${n}.`, open: "Open the card",
        res: (p) => (p === 100 ? "Perfect, nothing slips past you ✧" : p >= 80 ? "Sharp eyes ✧" : p >= 60 ? "Nice, keep going ✧" : "Every miss is a new card to learn ✧"),
        resSub: "Each round picks 10 random fallacies, so the next one will be different.",
        dLede: "Paste an argument and see which patterns it might contain.", dPh: "e.g. “Everyone's using this skincare, so it must be good.”",
        dGo: "Check it", dTry: "Try:", samples: ["Everyone's using this skincare, so it must be good.", "Kalau kamu tidak mendukung kami, berarti kamu melawan kami.", "The movie is awful, but we already paid, so we have to stay."],
        dEmpty: "Write or paste an argument first.", dFound: (n) => `${n} possible pattern${n === 1 ? "" : "s"} found`, matched: "matched",
        dNone: "No obvious pattern found. That doesn't mean the argument is sound: check whether the premises are true and whether the conclusion really follows.",
        dNote: "How this works: the detector looks for keywords and phrases (in English and Indonesian). It isn't AI and it can't understand context, so treat every result as a hint to check, not a verdict.",
        g: {
          what: "What is a logical fallacy?", whatP: "A logical fallacy is a flaw in reasoning: the reasons given don't actually support the conclusion, even if the argument sounds convincing.",
          cats: "The four groups used here", catsP: "Tap a group to see its cards.",
          catDesc: { relevance: "The reasons offered don't actually bear on the claim.", appeal: "Status, popularity, feelings, nature or tradition stand in for evidence. Strictly, these are a special kind of relevance fallacy.", informal: "The reasoning rests on a hidden assumption, too little evidence or a faulty link between cause and effect.", formal: "The structure itself is invalid, so the conclusion doesn't follow even if every premise were true." },
          careful: "Two things to keep in mind", careful1: "Spotting a fallacy doesn't make the conclusion false. An argument can be badly made and still land on something true. Assuming otherwise is called the fallacy fallacy.",
          careful2: "Some patterns are only fallacies in certain cases. Citing a real expert with evidence, or warning about a chain of events that is backed by data, is reasonable.",
          why: "Why it matters", whyL: ["Sharper critical thinking", "Stronger, fairer arguments of your own", "Spotting manipulation in ads, news and debates", "Better decisions"] },
      },
      id: { lede: "Belajar mengenali penalaran yang keliru.", scribble: "pikir dua kali,<br>berdebat dengan baik",
        tabs: ["Jelajahi", "Kuis", "Detektor", "Panduan"], eLede: "Ketuk kartu untuk melihat cara mengenalinya.", search: "Cari fallacy…", all: "Semua",
        count: (n) => `${n} fallacy`, none: "Tidak ada yang cocok dengan pencarian itu.",
        def: "Definisi", spot: "Cara mengenali", bad: "Contoh fallacy", good: "Respons yang lebih baik", life: "Di kehidupan nyata",
        prev: "Sebelumnya", next: "Berikutnya", close: "Tutup",
        qAsk: "Fallacy apa ini?", qOf: (i, n) => `Soal ${i} dari ${n}`, score: "Skor", nextQ: "Soal berikutnya →", finish: "Lihat hasilku →", again: "Main lagi",
        right: "Betul.", wrong: "Belum tepat.", it: (n) => `Jawabannya ${n}.`, open: "Buka kartunya",
        res: (p) => (p === 100 ? "Sempurna, tidak ada yang lolos ✧" : p >= 80 ? "Jeli sekali ✧" : p >= 60 ? "Bagus, lanjutkan ✧" : "Setiap salah adalah kartu baru untuk dipelajari ✧"),
        resSub: "Setiap ronde memilih 10 fallacy secara acak, jadi ronde berikutnya akan berbeda.",
        dLede: "Tempel sebuah argumen dan lihat pola apa yang mungkin ada di dalamnya.", dPh: "misalnya “Semua orang pakai skincare ini, pasti bagus.”",
        dGo: "Periksa", dTry: "Coba:", samples: ["Semua orang pakai skincare ini, pasti bagus.", "Kalau kamu tidak mendukung kami, berarti kamu melawan kami.", "Filmnya jelek, tapi tiketnya sudah dibayar, jadi harus ditonton sampai habis."],
        dEmpty: "Tulis atau tempel argumennya dulu.", dFound: (n) => `${n} kemungkinan pola ditemukan`, matched: "cocok dengan",
        dNone: "Tidak ada pola yang jelas. Bukan berarti argumennya pasti benar: cek apakah premisnya benar dan apakah kesimpulannya memang mengikuti.",
        dNote: "Cara kerjanya: detektor ini mencari kata kunci dan frasa (dalam bahasa Inggris dan Indonesia). Ini bukan AI dan tidak bisa memahami konteks, jadi anggap setiap hasil sebagai petunjuk untuk dicek, bukan vonis.",
        g: {
          what: "Apa itu logical fallacy?", whatP: "Logical fallacy adalah cacat dalam penalaran: alasan yang diberikan sebenarnya tidak mendukung kesimpulannya, meskipun argumennya terdengar meyakinkan.",
          cats: "Empat kelompok yang dipakai di sini", catsP: "Ketuk sebuah kelompok untuk melihat kartunya.",
          catDesc: { relevance: "Alasan yang diberikan sebenarnya tidak berkaitan dengan klaim.", appeal: "Status, popularitas, perasaan, kealamian, atau tradisi dipakai sebagai pengganti bukti. Secara ketat, ini termasuk jenis khusus fallacy relevansi.", informal: "Penalarannya bertumpu pada asumsi tersembunyi, bukti yang terlalu sedikit, atau hubungan sebab-akibat yang keliru.", formal: "Strukturnya sendiri tidak valid, jadi kesimpulannya tidak mengikuti walaupun semua premisnya benar." },
          careful: "Dua hal yang perlu diingat", careful1: "Menemukan fallacy tidak membuat kesimpulannya otomatis salah. Argumen bisa disusun dengan buruk tapi tetap berakhir pada sesuatu yang benar. Menganggap sebaliknya disebut fallacy fallacy.",
          careful2: "Beberapa pola baru menjadi fallacy dalam kondisi tertentu. Mengutip ahli sungguhan yang disertai bukti, atau mengingatkan rangkaian akibat yang didukung data, itu wajar.",
          why: "Kenapa penting", whyL: ["Berpikir kritis jadi lebih tajam", "Argumenmu sendiri jadi lebih kuat dan adil", "Lebih peka terhadap manipulasi di iklan, berita, dan debat", "Keputusan jadi lebih baik"] },
      },
    };
    const S = { lang: "en", mode: "explorer", cat: "all", q: "", open: -1, from: null, quiz: null };
    try { S.lang = localStorage.getItem("sl_fallacy_lang") === "id" ? "id" : "en"; } catch {}
    const T = () => UI[S.lang];
    const L = (o) => o[S.lang] || o.en;
    const altName = (f) => (S.lang === "id" && f.name.id !== f.name.en ? f.name.id : "");

    // ---------- explorer ----------
    function renderExplorer() {
      const t = T();
      $("eLede").textContent = t.eLede;
      $("q").placeholder = t.search;
      $("cats").innerHTML = ["all", ...Object.keys(CATS)].map((k) => `<button class="chip" aria-pressed="${S.cat === k}" data-c="${k}">${k === "all" ? "" : `<span class="dot" style="background:${CATS[k].dot}"></span>`}${esc(k === "all" ? t.all : L(CATS[k]))}</button>`).join("");
      const q = S.q.trim().toLowerCase();
      const list = FALLACIES.map((f, i) => ({ f, i })).filter(({ f }) => (S.cat === "all" || f.cat === S.cat) &&
        (!q || [f.name.en, f.name.id, f.desc.en, f.desc.id].join(" ").toLowerCase().includes(q)));
      $("count").textContent = t.count(list.length);
      $("grid").innerHTML = list.length ? list.map(({ f, i }) => `<button class="fcard" data-o="${i}" style="--c:${CATS[f.cat].dot}">
        <span class="fk"><span><span class="dot" style="background:${CATS[f.cat].dot}"></span>${esc(L(CATS[f.cat]))}</span><span class="case">case ${pad2(i + 1)}</span></span>
        <h3>${esc(f.name.en)}</h3>${altName(f) ? `<span class="alt">${esc(altName(f))}</span>` : ""}<p>${esc(L(f.desc))}</p></button>`).join("")
        : `<div class="empty">${esc(t.none)}</div>`;
    }

    function renderSheet() {
      const t = T(), f = FALLACIES[S.open];
      $("modal").setAttribute("aria-label", f.name.en);
      $("sheet").style.setProperty("--c", CATS[f.cat].dot);
      $("sheet").innerHTML = `<div class="fshd"><span class="fk"><span><span class="dot" style="background:${CATS[f.cat].dot}"></span>case file ${pad2(S.open + 1)} · ${esc(L(CATS[f.cat]))}</span></span>
        <div class="fnav"><button data-nav="-1" aria-label="${esc(t.prev)}">←</button><button data-nav="1" aria-label="${esc(t.next)}">→</button><button class="x" data-close aria-label="${esc(t.close)}">✕</button></div></div>
        <h2>${esc(f.name.en)}</h2>${altName(f) ? `<div class="alt">${esc(altName(f))}</div>` : ""}
        <p class="def">${esc(L(f.desc))}</p>
        <div class="boxes">
          <div class="box w"><div class="lb">${esc(t.spot)}</div><p>${esc(L(f.spot))}</p></div>
          <div class="box bad"><div class="lb">✕ ${esc(t.bad)}</div><p>${esc(L(f.bad))}</p></div>
          <div class="box good"><div class="lb">✓ ${esc(t.good)}</div><p>${esc(L(f.good))}</p></div>
          <div class="box w"><div class="lb">${esc(t.life)}</div><p>${esc(L(f.life))}</p></div>
        </div>`;
    }
    function openSheet(i, from) {
      S.open = i; S.from = from || document.activeElement; renderSheet();
      $("modal").hidden = false; document.body.style.overflow = "hidden"; $("modal").scrollTop = 0;
      $("sheet").querySelector(".x").focus();
    }
    function closeSheet() {
      if ($("modal").hidden) return;
      $("modal").hidden = true; $("sheet").innerHTML = ""; S.open = -1; document.body.style.overflow = "";
      if (S.from && document.body.contains(S.from)) S.from.focus();
    }
    function step(n) { S.open = (S.open + n + FALLACIES.length) % FALLACIES.length; renderSheet(); $("sheet").querySelector(`[data-nav="${n}"]`).focus(); }

    // ---------- quiz ----------
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    function newQuiz() {
      const picks = shuffle(FALLACIES.map((_, i) => i)).slice(0, 10);
      S.quiz = { qs: picks.map((i) => {
        const same = FALLACIES.map((_, k) => k).filter((k) => k !== i && FALLACIES[k].cat === FALLACIES[i].cat);
        const rest = FALLACIES.map((_, k) => k).filter((k) => k !== i && FALLACIES[k].cat !== FALLACIES[i].cat);
        const wrong = shuffle(same).slice(0, 2).concat(shuffle(rest)).slice(0, 3);
        return { i, opts: shuffle([i, ...wrong]), picked: null };
      }), at: 0, score: 0, done: false };
    }
    function renderQuiz() {
      const t = T(), Z = S.quiz;
      if (!Z) newQuiz();
      const z = S.quiz;
      if (z.done) {
        const p = Math.round((z.score / z.qs.length) * 100);
        $("quizBox").innerHTML = `<div class="qcard res"><div class="big">${z.score}/${z.qs.length}</div><div class="msg">${esc(t.res(p))}</div><p>${esc(t.resSub)}</p>
          <div class="qact"><button class="btn dark" data-q="again">${esc(t.again)}</button></div></div>`;
        return;
      }
      const cur = z.qs[z.at], f = FALLACIES[cur.i], answered = cur.picked !== null;
      $("quizBox").innerHTML = `<div class="qhead"><span>${esc(t.qOf(z.at + 1, z.qs.length))}</span><span>${esc(t.score)} <b>${z.score}</b></span></div>
        <div class="bar"><i style="width:${((z.at + (answered ? 1 : 0)) / z.qs.length) * 100}%"></i></div>
        <div class="qcard"><div class="ask">${esc(t.qAsk)}</div><div class="q">${esc(L(f.bad))}</div>
          <div class="opts">${cur.opts.map((k) => {
            const cls = !answered ? "" : k === cur.i ? "ok" : k === cur.picked ? "no" : "";
            return `<button class="opt ${cls}" data-a="${k}" ${answered ? "disabled" : ""}>${esc(FALLACIES[k].name.en)}${cls === "ok" ? '<span class="mk">✓</span>' : cls === "no" ? '<span class="mk">✕</span>' : ""}</button>`;
          }).join("")}</div>
          ${answered ? `<div class="fb" role="status"><b>${esc(cur.picked === cur.i ? t.right : t.wrong)}</b> ${cur.picked === cur.i ? "" : esc(t.it(f.name.en)) + " "}${esc(L(f.desc))}
            <div style="margin-top:6px;color:var(--muted)">${esc(L(f.spot))}</div></div>` : ""}
        </div>
        ${answered ? `<div class="qact"><button class="btn" data-q="card" data-i="${cur.i}">${esc(t.open)}</button><button class="btn dark" data-q="next">${esc(z.at === z.qs.length - 1 ? t.finish : t.nextQ)}</button></div>` : ""}`;
    }

    // ---------- detector ----------
    function renderDetectorText() {
      const t = T();
      $("dLede").textContent = t.dLede; $("din").placeholder = t.dPh; $("dGo").textContent = t.dGo;
      $("dTry").innerHTML = `${esc(t.dTry)} ` + t.samples.map((s, i) => `<button data-s="${i}">${i + 1}</button>`).join(" ");
    }
    function analyze() {
      const t = T(), raw = $("din").value.trim();
      if (!raw) { $("dRes").innerHTML = `<p class="note">${esc(t.dEmpty)}</p>`; return; }
      const text = raw.toLowerCase(), hits = [];
      RULES.forEach((r) => { const m = text.match(r.re); if (m && !hits.some((h) => h.id === r.id)) hits.push({ id: r.id, m: raw.substr(m.index, m[0].length) }); });
      const note = `<p class="note">${esc(t.dNote)}</p>`;
      if (!hits.length) { $("dRes").innerHTML = `<div class="hit"><h4>✓</h4><p class="why">${esc(t.dNone)}</p></div>${note}`; return; }
      $("dRes").innerHTML = `<p class="flede" style="margin:4px 0 0;font-size:22px">${esc(t.dFound(hits.length))}</p>` + hits.map((h) => {
        const i = FALLACIES.findIndex((f) => f.id === h.id), f = FALLACIES[i];
        return `<div class="hit"><h4>${esc(f.name.en)}</h4><p class="why">${esc(t.matched)} “<mark>${esc(h.m)}</mark>” · ${esc(L(f.spot))}</p>
          <button class="open" data-o="${i}">${esc(t.open)} →</button></div>`;
      }).join("") + note;
    }

    // ---------- guide ----------
    function renderGuide() {
      const g = T().g;
      $("guide").innerHTML = `<div class="gsec"><h3>${esc(g.what)}</h3><p>${esc(g.whatP)}</p></div>
        <div class="gsec"><h3>${esc(g.cats)}</h3><p style="color:var(--muted);font-size:14px">${esc(g.catsP)}</p><div class="gcats">${Object.keys(CATS).map((k) =>
          `<button class="gcat" data-gc="${k}"><span class="n">${FALLACIES.filter((f) => f.cat === k).length}</span><b><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${CATS[k].dot};margin-right:8px"></span>${esc(L(CATS[k]))}</b><p>${esc(g.catDesc[k])}</p></button>`).join("")}</div></div>
        <div class="gsec"><h3>${esc(g.careful)}</h3><ul><li>${esc(g.careful1)}</li><li>${esc(g.careful2)}</li></ul></div>
        <div class="gsec"><h3>${esc(g.why)}</h3><ul>${g.whyL.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    }

    // ---------- shell ----------
    function render() {
      const t = T();
      document.documentElement.lang = S.lang;
      $("tLede").textContent = t.lede; $("tScribble").innerHTML = t.scribble;
      ["tbExplorer", "tbQuiz", "tbDetector", "tbGuide"].forEach((id, i) => { $(id).textContent = t.tabs[i]; });
      document.querySelectorAll("[data-m]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.m === S.mode)));
      document.querySelectorAll("[data-l]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === S.lang)));
      ["explorer", "quiz", "detector", "guide"].forEach((m) => { $(m).hidden = m !== S.mode; });
      renderExplorer(); renderDetectorText();
      if (S.mode === "quiz") renderQuiz();
      if (S.mode === "guide") renderGuide();
      if (S.mode === "detector" && $("dRes").innerHTML) analyze();
      if (S.open >= 0) renderSheet();
    }
    function setMode(m) { S.mode = m; history.replaceState(null, "", m === "explorer" ? location.pathname : "#" + m); render(); }

    document.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => setMode(b.dataset.m));
    document.querySelectorAll("[data-l]").forEach((b) => b.onclick = () => { S.lang = b.dataset.l; try { localStorage.setItem("sl_fallacy_lang", S.lang); } catch {} render(); });
    $("q").addEventListener("input", (e) => { S.q = e.target.value; renderExplorer(); });
    document.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.c) { S.cat = b.dataset.c; renderExplorer(); }
      else if (b.dataset.o !== undefined) openSheet(+b.dataset.o, b);
      else if (b.dataset.a !== undefined) { const z = S.quiz, cur = z.qs[z.at]; if (cur.picked !== null) return; cur.picked = +b.dataset.a; if (cur.picked === cur.i) z.score++; renderQuiz(); const n = $("quizBox").querySelector('[data-q="next"]'); if (n) n.focus(); }
      else if (b.dataset.q === "next") { const z = S.quiz; if (z.at === z.qs.length - 1) z.done = true; else z.at++; renderQuiz(); const f = $("quizBox").querySelector(".opt, [data-q]"); if (f) f.focus(); }
      else if (b.dataset.q === "again") { newQuiz(); renderQuiz(); }
      else if (b.dataset.q === "card") openSheet(+b.dataset.i, b);
      else if (b.dataset.s !== undefined) { $("din").value = T().samples[+b.dataset.s]; analyze(); }
      else if (b.dataset.gc) { S.cat = b.dataset.gc; S.q = ""; $("q").value = ""; setMode("explorer"); }
      else if (b.dataset.nav) step(+b.dataset.nav);
      else if (b.closest("[data-close]") || b.dataset.close !== undefined) closeSheet();
    });
    $("modal").addEventListener("click", (e) => { if (e.target.hasAttribute("data-close")) closeSheet(); });
    $("dGo").onclick = analyze;
    document.addEventListener("keydown", (e) => {
      if ($("modal").hidden) return;
      if (e.key === "Escape") closeSheet(); else if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1);
    });
    const h = location.hash.slice(1);
    if (["quiz", "detector", "guide"].includes(h)) S.mode = h;
    render();
  })();
  </script>
</body>
</html>
