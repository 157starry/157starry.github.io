<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lieux · s(T☆R)light</title>
  <meta name="description" content="Places that stayed with me.">
  <meta name="theme-color" content="#F6E9E9">
  <meta property="og:title" content="Lieux · s(T☆R)light">
  <meta property="og:image" content="https://157starry.github.io/assets/og-image.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---------- Lieux · postcards ---------- */
    main.page.lieux { max-width: 980px; }
    .lieux #map { height: 340px; border-radius: 18px; overflow: hidden; border: 6px solid #FFFDF8;
      box-shadow: 0 10px 30px rgba(110,70,80,.14); margin: 18px 0 34px; }
    .lieux #map .leaflet-tile-pane { filter: sepia(.35) saturate(.7) hue-rotate(-15deg) brightness(1.04); }
    .lieux .sec-h { font-family: "Caveat", cursive; font-size: 26px; color: #8F5864; margin: 0 0 14px; }

    .postcards { display: grid; grid-template-columns: 1fr; gap: 26px; padding-bottom: 40px; }
    @media (min-width: 720px) { .postcards { grid-template-columns: 1fr 1fr; } }

    .pc { position: relative; background: #FFFDF8; border-radius: 6px; padding: 18px 18px 20px;
      box-shadow: 0 8px 24px rgba(110,70,80,.13); cursor: pointer; transition: transform .25s, box-shadow .25s;
      background-image: repeating-linear-gradient(transparent 0 27px, rgba(176,122,134,.10) 27px 28px); }
    .pc::before { content: ""; position: absolute; inset: 0; border-radius: 6px; padding: 6px; pointer-events: none;
      background: repeating-linear-gradient(135deg, #E7A9B5 0 14px, #FFFDF8 14px 22px, #A9BFA0 22px 36px, #FFFDF8 36px 44px);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: .75; }
    .pc:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(110,70,80,.18); }
    .pc.on { box-shadow: 0 0 0 3px #B07A86, 0 14px 30px rgba(110,70,80,.18); }

    .polaroid { background: #fff; padding: 10px 10px 28px; width: 78%; margin: 8px 0 4px 4px;
      box-shadow: 0 6px 16px rgba(60,40,45,.18); transform: rotate(-2.2deg); position: relative; }
    .pc:nth-child(even) .polaroid { transform: rotate(1.8deg); }
    .polaroid .track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: #EFE6E3; }
    .polaroid .track::-webkit-scrollbar { display: none; }
    .polaroid .track > div { flex: 0 0 100%; aspect-ratio: 4 / 3; scroll-snap-align: center; background-size: cover; background-position: center; }
    .polaroid .none { display: grid; place-items: center; font-family: "Caveat", cursive; font-size: 20px; color: #B39AA0; }
    .polaroid .dots { position: absolute; left: 0; right: 0; bottom: 9px; display: flex; justify-content: center; gap: 6px; }
    .polaroid .dots i { width: 6px; height: 6px; border-radius: 50%; background: #E2D3D6; }
    .polaroid .dots i.on { background: #8F5864; }
    .polaroid .tape { position: absolute; top: -10px; left: 50%; width: 70px; height: 20px; transform: translateX(-50%) rotate(-3deg);
      background: rgba(231,169,181,.55); }

    .stamp { position: absolute; top: 18px; right: 18px; width: 66px; height: 78px; padding: 5px; color: #8F5864;
      background: radial-gradient(circle at 5px 5px, transparent 2.6px, #F6E3E6 3px) -5px -5px / 10px 10px; }
    .stamp .in { width: 100%; height: 100%; background: #F6E3E6; outline: 1px dashed #D9B3BB; outline-offset: -4px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .stamp span { font: 600 13px/1 "Lora", serif; letter-spacing: 1px; }
    .stamp b { font: 700 22px/1.1 "Playfair Display", serif; }
    .stamp em { font-style: normal; font-size: 11px; margin-top: 2px; }
    .postmark { position: absolute; top: 74px; right: 54px; width: 70px; height: 70px; border-radius: 50%;
      border: 2px solid rgba(143,88,100,.35); color: rgba(143,88,100,.45); display: grid; place-items: center;
      text-align: center; font: 600 9px/1.3 "Lora", serif; letter-spacing: 1.5px; transform: rotate(-14deg); pointer-events: none; }
    .postmark::after { content: ""; position: absolute; left: -46px; right: 60px; top: 30px; height: 10px;
      background: repeating-linear-gradient(transparent 0 2px, rgba(143,88,100,.3) 2px 3px, transparent 3px 5px); }

    .pc h3 { font: 700 21px/1.25 "Playfair Display", serif; color: #3B2A2F; margin: 14px 0 4px; padding-right: 8px; }
    .pc .note { font: 400 23px/1.25 "Caveat", cursive; color: #8F5864; margin: 0; }
    .pc .where { margin-top: 10px; font: 400 13px "Lora", serif; color: #9B8287; background: none; border: 0; padding: 0; cursor: pointer; }
    .pc .where:hover { color: #8F5864; text-decoration: underline; }
  </style>
</head>
<body>
  <main class="page lieux">
    <a class="back" href="./">← back to the sky</a>
    <h1 class="h1">Lieux</h1>
    <p class="lede">Places that stayed with me. Tap a pin, or a postcard.</p>
    <div id="map" role="region" aria-label="Map of places"></div>
    <div id="places"></div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="common.js"></script>
  <script>
  (async function () {
    const { sb, esc, safeUrl } = SL;
    const map = L.map("map", { zoomControl: false, attributionControl: true, scrollWheelZoom: false }).setView([1.3521, 103.8198], 11);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    let places = [];
    if (sb) {
      const { data } = await sb.from("star_places").select("*").order("visited_on", { ascending: false, nullsFirst: false });
      places = data || [];
    }
    if (!places.length) {
      document.getElementById("places").innerHTML = `<div class="empty">No postcards yet.<br><span class="scribble">first place soon ✧</span></div>`;
      return;
    }

    const photosOf = (p) => {
      const arr = Array.isArray(p.photos) && p.photos.length ? p.photos : (p.photo_url ? [p.photo_url] : []);
      return arr.map(safeUrl).filter(Boolean).slice(0, 4);
    };
    const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const stamp = (d) => {
      if (!d) return `<div class="stamp" aria-hidden="true"><div class="in"><b>✧</b><em>lieux</em></div></div>`;
      const t = new Date(d);
      return `<div class="stamp" title="${esc(t.toLocaleDateString("en-GB", { month: "long", year: "numeric" }))}"><div class="in"><span>${MON[t.getMonth()]}</span><b>’${String(t.getFullYear()).slice(2)}</b><em>✧</em></div></div>`;
    };

    const icon = (on) => L.divIcon({ className: "", html: `<div class="pin ${on ? "on" : ""}"></div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
    const markers = {};
    document.getElementById("places").innerHTML = `<p class="sec-h">postcards from here & there ✉︎</p><div class="postcards">` + places.map((p) => {
      const ph = photosOf(p);
      const photos = ph.length
        ? `<div class="track">${ph.map((u) => `<div style="background-image:url('${esc(u)}')" role="img" aria-label="${esc(p.name)}"></div>`).join("")}</div>`
          + (ph.length > 1 ? `<div class="dots">${ph.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : "")
        : `<div class="track"><div class="none">no photo yet</div></div>`;
      return `<article class="pc" id="pl-${p.id}" data-id="${p.id}">
        <div class="polaroid"><span class="tape"></span>${photos}</div>
        ${stamp(p.visited_on)}
        <div class="postmark">S(T☆R)LIGHT<br>POST</div>
        <h3>${esc(p.name)}</h3>
        ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
        ${p.lat != null ? `<button class="where" type="button">⌖ see it on the map</button>` : ""}
      </article>`;
    }).join("") + `</div>`;

    // photo dots follow the swipe
    document.querySelectorAll(".polaroid .track").forEach((tr) => {
      const dots = tr.parentElement.querySelectorAll(".dots i");
      if (!dots.length) return;
      tr.addEventListener("scroll", () => {
        const i = Math.round(tr.scrollLeft / tr.clientWidth);
        dots.forEach((d, k) => d.classList.toggle("on", k === i));
      }, { passive: true });
      tr.addEventListener("click", (e) => e.stopPropagation()); // swiping photos shouldn't jump to the map
    });

    function select(id, scroll) {
      Object.entries(markers).forEach(([k, m]) => m.setIcon(icon(k === id)));
      document.querySelectorAll(".pc").forEach((el) => el.classList.toggle("on", el.dataset.id === id));
      const p = places.find((x) => x.id === id);
      if (p && p.lat != null) map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 14), { duration: .6 });
      if (scroll) document.getElementById("pl-" + id).scrollIntoView({ behavior: "smooth", block: "center" });
    }

    const pts = [];
    places.forEach((p) => {
      if (p.lat == null || p.lng == null) return;
      const m = L.marker([p.lat, p.lng], { icon: icon(false), title: p.name }).addTo(map);
      m.on("click", () => select(p.id, true));
      markers[p.id] = m;
      pts.push([p.lat, p.lng]);
    });
    if (pts.length === 1) map.setView(pts[0], 14);
    else if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });

    document.querySelectorAll(".pc").forEach((el) => el.onclick = () => {
      if (!markers[el.dataset.id]) return;
      select(el.dataset.id, false);
      document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "center" });
    });
  })();
  </script>
</body>
</html>
